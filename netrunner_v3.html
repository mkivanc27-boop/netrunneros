  function buildMegaCorp(rng, corp, cname, tier, usedCompanyNames){
    const slug = slugify(corp.name) + '-' + slugify(cname).slice(0,3);
    usedCompanyNames.add(corp.name);
    const security = 10;
    const nodes = [];
    nodes.push(makeNode(rng, 'GATEWAY', slug, security, true));
    // Mega-şirketler tüm departman tiplerine sahip — daha büyük, daha zengin bir ağ.
    nodeTypePool.forEach(nt=> nodes.push(makeNode(rng, nt, slug, security, false)));
    // Kötü sır dosyasını rastgele bir node'a ekle (gateway hariç).
    const targetNode = pick(rng, nodes.filter(n=>!n.isGateway));
    const gatePort = targetNode.ports.length ? pick(rng, targetNode.ports).port : 443;
    targetNode.files.push({
      name: corp.secretFile, gatePort,
      value: randInt(rng, 900, 1500) * security,
      isVault: false, isPassFile:false,
      isSecret: true, secretText: corp.secretText
    });
    return { name: corp.name, slug, sector: corp.sector, security, tier, nodes, isMega:true };
  }
  function buildWorld(){
    const rng = seededRand('netrunner-fixed-world-v5');
    const regions = [];
    const usedCompanyNames = new Set();
    const megaByKey = {};
    MEGA_PLACEMENT.forEach((p, i)=>{ megaByKey[p.region+'|'+p.city] = MEGA_CORPS[i]; });
    for (const rname of regionNames){
      const cities = [];
      const cityList = cityBank[rname];
      const power = regionPowerFor(rname);
      cityList.forEach((cname, cityIdx)=>{
        const tier = cityIdx+1;
        const companyCount = randInt(rng, power.companyRange[0], power.companyRange[1]);
        const companies = [];
        for (let i=0;i<companyCount;i++){
          let full, tries=0;
          do {
            full = pick(rng, orgNames) + ' ' + pick(rng, orgSuffix);
            tries++;
          } while (usedCompanyNames.has(full) && tries<20);
          usedCompanyNames.add(full);
          const slug = slugify(full) + '-' + slugify(cname).slice(0,3);
          const sector = pick(rng, sectors);
          const security = Math.max(1, Math.min(10, Math.round(tier*power.securityMult) + randInt(rng,1,4)));
          const nodeTypes = shuffled(rng, nodeTypePool).slice(0, randInt(rng,3,4));
          const nodes = [];
          // gateway node
          nodes.push(makeNode(rng, 'GATEWAY', slug, security, true));
          nodeTypes.forEach(nt=> nodes.push(makeNode(rng, nt, slug, security, false)));
          companies.push({ name: full, slug, sector, security, tier, nodes });
        }
        const corp = megaByKey[rname+'|'+cname];
        if (corp){
          companies.push(buildMegaCorp(rng, corp, cname, tier, usedCompanyNames));
        }
        cities.push({ name: cname, tier, companies });
      });
      regions.push({ name: rname, cities });
    }
    return { regions };
  }

  function makeNode(rng, type, companySlug, companySecurity, isGateway){
    const hostname = `${type.toLowerCase().replace('&','n')}.${companySlug}.corp`;
    if (isGateway){
      const hasBlackIce = companySecurity>=8 && rng()<0.5;
      return { type, hostname, security: companySecurity, isGateway: true, firewallPort: 9999, files: [], hasBlackIce };
    }
    const security = Math.max(1, Math.min(10, companySecurity + randInt(rng,-1,2)));
    const portCount = randInt(rng, 2, 4);
    const ports = shuffled(rng, services).slice(0, portCount).map(p=>({port:p, service:serviceName[p]}));
    const bank = nodeFiles[type] || nodeFiles['ARCHIVE'];
    const fileCount = randInt(rng, 2, Math.min(bank.length, 4));
    const names = shuffled(rng, bank).slice(0, fileCount);
    const files = names.map(fn=>{
      const gatePort = pick(rng, ports).port;
      const value = randInt(rng,50,90) * security + randInt(rng,0,250);
      const isVault = rng() < 0.25;
      return { name: fn, gatePort, value, isVault, isPassFile: fn.includes('keys') || fn.includes('access') };
    });
    const hasBlackIce = security>=8 && rng()<0.35;
    return { type, hostname, security, isGateway:false, ports, files, hasBlackIce };
  }

  // ---------- Persistence (Claude artifact window.storage OR standalone localStorage) ----------
  // 4 independent save slots + one shared macro bank used by every slot.
  const SLOT_COUNT = 4;
  const META_KEY = 'netrunner-meta-v5';
  const MACRO_KEY = 'netrunner-macros-v5';
  function saveKeyFor(slot){ return `netrunner-save-v5-slot${slot}`; }
  const hasArtifactStorage = () => (typeof window.storage !== 'undefined' && typeof window.storage.set === 'function');

  async function storageGet(key){
    try{
      if (hasArtifactStorage()){
        const res = await window.storage.get(key, false);
        return (res && res.value) ? res.value : null;
      }
      return localStorage.getItem(key);
    }catch(e){
      try{ return localStorage.getItem(key); }catch(e2){ return null; }
    }
  }
  async function storageSet(key, value){
    try{
      if (hasArtifactStorage()) await window.storage.set(key, value, false);
      else localStorage.setItem(key, value);
    }catch(e){
      try{ localStorage.setItem(key, value); }catch(e2){}
    }
  }
  async function storageDelete(key){
    try{
      if (hasArtifactStorage()) await window.storage.delete(key, false);
      else localStorage.removeItem(key);
    }catch(e){
      try{ localStorage.removeItem(key); }catch(e2){}
    }
  }

  let activeSlot = 1;

  async function loadMeta(){
    const raw = await storageGet(META_KEY);
    try{ return raw ? JSON.parse(raw) : { lastSlot: 1 }; }catch(e){ return { lastSlot: 1 }; }
  }
  async function saveMeta(){
    await storageSet(META_KEY, JSON.stringify({ lastSlot: activeSlot }));
  }

  let saveScheduled = false, saveLastRun = 0;
  async function save(){
    const nowT = Date.now();
    if (nowT - saveLastRun < 1500){
      if (!saveScheduled){
        saveScheduled = true;
        setTimeout(()=>{ saveScheduled=false; saveLastRun=Date.now(); const data=JSON.stringify(state); storageSet(saveKeyFor(activeSlot), data); }, 1500-(nowT-saveLastRun));
      }
      return;
    }
    saveLastRun = nowT;
    const data = JSON.stringify(state);
    await storageSet(saveKeyFor(activeSlot), data);
  }
  async function load(slot){
    activeSlot = slot;
    const raw = await storageGet(saveKeyFor(slot));
    const isNew = !raw;
    try{
      state = raw ? JSON.parse(raw) : DEFAULT_STATE();
    }catch(e){ state = DEFAULT_STATE(); }
    // migrate missing fields
    const def = DEFAULT_STATE();
    for (const k in def) if (!(k in state)) state[k] = def[k];
    if (state.ai && typeof state.ai.chatUsedToday !== 'number') state.ai.chatUsedToday = 0;
    if (typeof state.gameMinutes !== 'number') state.gameMinutes = 0;
    // Offline passive rig income: catch up game time based on real elapsed time, then pay out rigs.
    if (!isNew && state.lastRealMs){
      const offlineMs = Math.max(0, Date.now() - state.lastRealMs);
      const offlineGameMin = offlineMs * (1440/(20*60*1000));
      if (offlineGameMin > 0.5){
        const prevMin = state.gameMinutes;
        state.gameMinutes += offlineGameMin;
        if (state.rigs>0){
          const elapsed = state.gameMinutes - (state.lastRigPayoutMin!==undefined?state.lastRigPayoutMin:prevMin);
          if (elapsed>0){
            const earned = Math.floor(elapsed*0.55*state.rigs);
            if (earned>0){
              state.credits += earned; state.totalEarned=(state.totalEarned||0)+earned;
              state.offlineRigEarned = earned;
            }
          }
        }
        state.lastRigPayoutMin = state.gameMinutes;
      }
    }
    state.lastRealMs = Date.now();
    if (!state.activeEvents) state.activeEvents = [];
    if (!state.eventLog) state.eventLog = [];
    if (!state.honeypots) state.honeypots = {};
    if (!state.forensics) state.forensics = {};
    if (!state.rivalProfiles) state.rivalProfiles = {};
    if (!state.marketMods) state.marketMods = {};

  function repTier(v){ let t=REP_TIERS[0][1]; for (const [th,name] of REP_TIERS) if (v>=th) t=name; return t; }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function formatGameTime(mins){
    mins = mins||0;
    const day = Math.floor(mins/1440)+1;
    const hh = Math.floor((mins%1440)/60);
    const mm = mins%60;
    return `gün ${day} - ${pad2(hh)}:${pad2(mm)}`;
  }
  const RIG_INCOME_PER_MIN = 0.55; // credits per game-minute per rig tier
  function advanceGameTime(mins){
    const prevWholeMin = Math.floor(state.gameMinutes||0);
    state.gameMinutes = (state.gameMinutes||0) + mins;
    const newWholeMin = Math.floor(state.gameMinutes);
    if (clockTop) clockTop.textContent = formatGameTime(state.gameMinutes);
    if (newWholeMin>prevWholeMin && state.mode==='defender') defenderTick();
    if (state.mcServer){
      const prevDay = Math.floor(prevWholeMin/GAME_DAY_MIN_CONST);
      const newDay = Math.floor(newWholeMin/GAME_DAY_MIN_CONST);
      if (newDay>prevDay){
        const wasCrashed = state.mcServer.crashed;
        const prevGriefCount = state.mcServer.totalGriefIncidents||0;
        mcServerTick(newDay-prevDay);
        if (!wasCrashed && state.mcServer.crashed){
          print(`💥 Minecraft sunucun yük altında çöktü! Tamir için: mcserver repair (${mcRepairCost(state.mcServer)} kredi).`,'bad');
        } else if ((state.mcServer.totalGriefIncidents||0) > prevGriefCount){
          print(`⚠️ Minecraft sunucunda griefer/hile skandalı yaşandı — oyuncu ve itibar kaybettin. ("mcserver hire" ile moderatör tutmak riski azaltır)`,'warn');
        }
      }
    }
    if (state.rigs>0){
      const elapsed = state.gameMinutes - (state.lastRigPayoutMin||state.gameMinutes);
      if (elapsed>0){
        const earned = Math.floor(elapsed*RIG_INCOME_PER_MIN*state.rigs);
        if (earned>0){
          state.credits += earned;
          state.totalEarned = (state.totalEarned||0)+earned;
          state.lastRigPayoutMin = state.gameMinutes;
          if (session.rigIncomeSinceLastPrint===undefined) session.rigIncomeSinceLastPrint = 0;
          session.rigIncomeSinceLastPrint += earned;
        }
      }
    }
  }

  function traceMultiplier(){
    const base = Math.pow(0.85, session.routeChain.length);
    const ghostBonus = state.faction==='ghost' ? 0.85 : 1;

    const shBonus = shTier ? Math.max(0.7, 1 - Math.min(30,shTier*8)/100) : 1;

  }

    session.trace = Math.max(0, session.trace + amount*traceMultiplier());

          print(`    ▸ [GATEWAY] ${n.hostname}  ${gwBreached?'KIRILDI':'AKTİF'}`, gwBreached?'hi':'warn');
        } else if (gwBreached){

          const cracked = prog ? prog.cracked.length : 0;
          const dl = prog ? prog.downloaded.length : 0;

          print(`    ▸ [${n.type.padEnd(12)}] ${n.hostname}`,'dim');

    print(`  TAVSİYE SALDIRI:`,'warn');

    blank();
    if (!state.history.includes(co.slug)) state.history.push(co.slug);
    save();

  // ---------- Safehouses (property ownership) ----------
  const SAFEHOUSE_BASE_COST = 1200;
  function safehouseCostFor(tier){ return Math.round(SAFEHOUSE_BASE_COST*(1+tier*0.6)); }
  function cmdSafehouse(arg){
    const sub = (arg||'').trim().toLowerCase();
    if (sub==='list' || sub===''){
      blank(); print('SAHİP OLUNAN GÜVENLİ EVLER','info');
      if (!state.safehouses.length){ print('  Henüz bir güvenli evin yok. "safehouse buy" ile bulunduğun şehirde bir tane al.','dim'); }
      else state.safehouses.forEach(sh=> print(`  ${sh.cityName.padEnd(18)} tier ${sh.tier}  — iz azaltma %${Math.min(30,sh.tier*8)}, karaborsa indirimi %${Math.min(20,sh.tier*5)}`,'hi'));
      print('Kullanım: safehouse buy   |   safehouse upgrade <şehir>   |   safehouse list','dim');
      return;
    }
    if (sub==='buy'){
      if (!state.location.city){ print('Önce bir şehre git: "city <ad>"','warn'); return; }
      if (state.safehouses.find(sh=>sh.cityName===state.location.city)){ print('Bu şehirde zaten bir güvenli evin var. "safehouse upgrade" ile geliştir.','warn'); return; }
      const cost = safehouseCostFor(0);
      if (state.credits<cost){ print(`Yetersiz kredi (${cost} gerekli).`,'warn'); return; }
      state.credits -= cost;
      state.safehouses.push({ cityName: state.location.city, tier:1, boughtAtMin: state.gameMinutes });
      print(`Güvenli ev satın alındı: ${state.location.city} (tier 1). Bu şehirde artık iz avantajın ve karaborsa indirimin var.`,'gold');
      updateTopbar(); save(); return;
    }
    if (sub==='upgrade'){
      const cityArg = arg.trim().slice(7).trim() || state.location.city;
      const sh = state.safehouses.find(s=>s.cityName.toLowerCase()===String(cityArg||'').toLowerCase());
      if (!sh){ print('Bu şehirde güvenli evin yok. "safehouse list" ile gör.','warn'); return; }
      const cost = safehouseCostFor(sh.tier);
      if (state.credits<cost){ print(`Yetersiz kredi (${cost} gerekli).`,'warn'); return; }
      state.credits -= cost; sh.tier++;
      print(`${sh.cityName} güvenli evi yükseltildi -> tier ${sh.tier}`,'gold');
      updateTopbar(); save(); return;
    }
    print('Kullanım: safehouse buy   |   safehouse upgrade [şehir]   |   safehouse list','warn');
  }
  function safehouseBonusFor(cityName){
    const sh = state.safehouses && state.safehouses.find(s=>s.cityName===cityName);
    return sh ? sh.tier : 0;
  }

  const VDS_TIERS = [
    { id:1, name:'Mikro VDS',      cost:800,   maxPlayers:20,   upkeepPerDay:15  },
    { id:2, name:'Standart VDS',   cost:2200,  maxPlayers:60,   upkeepPerDay:35  },

    { id:7, name:'Küresel CDN Ağı',            cost:120000,maxPlayers:5000, upkeepPerDay:1300 }

    { id:3, name:'Mega Mağaza',    cost:4000, ratePerPlayerDay:4.0  }
  ];
  const MOD_BASE_COST = 400;
  const MOD_UPKEEP_PER_DAY = 20;
  const MC_MEMBERSHIP_PRICE = 4; // kredi / oyuncu / gün (ortalama)
  const YOUTUBERS = [
    { id:1, name:'PixelKrallari35',  subs:'~6K abone',   cost:400,  minPct:0.08, maxPct:0.20, baseCrashChance:0.06 },
    { id:2, name:'GrindTV',          subs:'~140K abone', cost:1500, minPct:0.22, maxPct:0.45, baseCrashChance:0.14 },
    { id:3, name:'ServerKrali_Ünlü', subs:'~3.2M abone', cost:5000, minPct:0.50, maxPct:0.95, baseCrashChance:0.28 }
  ];
  const SPONSOR_COOLDOWN_MIN = 3*1440; // 3 oyun-içi gün
  function repBar(rep){
    const filled = Math.round(rep/10);
    return '['+'#'.repeat(filled)+'.'.repeat(10-filled)+']';
  }
  function mcEnsureFields(s){
    if (!s) return s;
    if (s.reputation===undefined) s.reputation = 50;
    if (s.mods===undefined) s.mods = 0;
    if (s.shopTier===undefined) s.shopTier = 0;
    if (s.totalShopEarned===undefined) s.totalShopEarned = 0;
    if (s.totalGriefIncidents===undefined) s.totalGriefIncidents = 0;
    return s;
  }
  function vdsTierInfo(tier){ return VDS_TIERS.find(t=>t.id===tier); }
  function mcRepairCost(s){ const t=vdsTierInfo(s.vdsTier); return Math.round(t.upkeepPerDay*5 + t.cost*0.04); }
  function mcTouchPeak(s){ s.peakPlayers = Math.max(s.peakPlayers||0, s.players); }
  function cmdMcServer(arg){
    const parts = (arg||'').trim().split(/\s+/);
    const sub = (parts[0]||'').toLowerCase();
    if (state.mcServer) mcEnsureFields(state.mcServer);
    if (!state.mcServer && sub!=='setup' && sub!==''){
      print('Henüz bir sunucun yok. "mcserver setup" ile VDS kirala ve sunucu kur.','warn'); return;
    }
    if (sub===''){
      if (!state.mcServer){
        blank(); print('MINECRAFT SUNUCUSU','info');
        print('Henüz bir sunucun yok.','dim');
        blank(); print('VDS SEÇENEKLERİ','info');
        VDS_TIERS.forEach(t=> print(`  [${t.id}] ${t.name.padEnd(16)} maks ${String(t.maxPlayers).padStart(3)} oyuncu   fiyat: ${t.cost}   günlük bakım: ${t.upkeepPerDay}`));
        print('Kullanım: mcserver setup <1-7>','dim');
        return;
      }
      const s = state.mcServer;
      const t = vdsTierInfo(s.vdsTier);
      blank(); print('MINECRAFT SUNUCUSU — DURUM','info');
      if (s.crashed){
        print(`  🔴 SUNUCU ÇÖKMÜŞ DURUMDA! (${t.name} yükü kaldıramadı)`,'bad');
        print(`  Oyuncular bağlanamıyor, gelir toplanmıyor. Tamir maliyeti: ${mcRepairCost(s)} kredi.`,'bad');
        print('Kullanım: mcserver repair','warn');
        return;
      }
      const loadPct = Math.round((s.players/t.maxPlayers)*100);
      const shop = SHOP_TIERS[s.shopTier];
      print(`  VDS: ${t.name}  (maks ${t.maxPlayers} oyuncu)`,'hi');
      print(`  Aktif oyuncu: ${s.players}/${t.maxPlayers}  (yük: %${loadPct})`, loadPct>=85?'warn':'hi');
      print(`  İtibar: ${s.reputation}/100  ${repBar(s.reputation)}`, s.reputation<35?'bad':(s.reputation<60?'warn':'hi'));
      print(`  Personel: ${s.mods} moderatör  (griefer/hile riskini azaltır)`, 'dim');
      print(`  Mağaza: ${shop.name}${shop.id>0?` (+~${Math.round(s.players*shop.ratePerPlayerDay)} kredi/gün)`:''}`, shop.id>0?'gold':'dim');
      print(`  Günlük tahmini üyelik geliri: ~${Math.round(s.players*MC_MEMBERSHIP_PRICE)} kredi`,'gold');
      print(`  Günlük bakım maliyeti: ${t.upkeepPerDay + s.mods*MOD_UPKEEP_PER_DAY} kredi`,'dim');
      if (loadPct>=85) print('  ⚠️ Sunucu yükü kritik seviyede — çökme riski artıyor. "mcserver upgrade" ile VDS büyüt.','warn');
      if (s.adBoostUntilMin && state.gameMinutes < s.adBoostUntilMin){
        print(`  📢 Reklam kampanyası aktif — oyuncu büyümesi hızlanıyor (${Math.ceil((s.adBoostUntilMin-state.gameMinutes)/GAME_DAY_MIN_CONST)} gün kaldı)`,'gold');
      }
      print('Kullanım: mcserver upgrade | mcserver ad | mcserver event | mcserver sponsor | mcserver hire | mcserver fire | mcserver shop | mcserver payout | mcserver stats','dim');
      return;
    }
    if (sub==='setup'){
      if (state.mcServer){ print('Zaten bir sunucun var. "mcserver upgrade" ile büyüt.','warn'); return; }
      const tierId = parseInt(parts[1],10);
      const t = vdsTierInfo(tierId);
      if (!t){ print('Kullanım: mcserver setup <1-7>','warn'); return; }
      if (state.credits < t.cost){ print(`Yetersiz kredi (${t.cost} gerekli).`,'warn'); return; }
      state.credits -= t.cost;
      const startPlayers = Math.max(1,Math.round(t.maxPlayers*0.05));
      state.mcServer = { vdsTier: t.id, players: startPlayers, adBoostUntilMin: 0, lastPayoutMin: state.gameMinutes, crashed:false, crashedAtMin:0, peakPlayers: startPlayers, totalMcEarned:0, totalCrashes:0, setupAtMin: state.gameMinutes, lastSponsorMin: state.gameMinutes - SPONSOR_COOLDOWN_MIN, reputation:50, mods:0, shopTier:0, totalShopEarned:0, totalGriefIncidents:0 };
      print(`${t.name} kiralandı ve Minecraft sunucusu kuruldu! İlk oyuncular katılmaya başladı.`,'gold');
      print('"mcserver payout" ile üyelik gelirini topla, "mcserver ad" ile büyümeyi hızlandır.','dim');
      updateTopbar(); save(); return;
    }
    if (sub==='upgrade'){
      const s = state.mcServer;
      if (s.crashed){ print('Sunucu çökmüş durumda. Önce "mcserver repair" ile tamir et.','bad'); return; }
      const cur = vdsTierInfo(s.vdsTier);
      const next = vdsTierInfo(s.vdsTier+1);
      if (!next){ print('Zaten en üst düzey VDS\'e sahipsin.','dim'); return; }
      if (state.credits < next.cost){ print(`Yetersiz kredi (${next.cost} gerekli).`,'warn'); return; }
      state.credits -= next.cost; s.vdsTier = next.id;
      print(`Sunucu yükseltildi -> ${next.name} (maks ${next.maxPlayers} oyuncu)`,'gold');
      updateTopbar(); save(); return;
    }
    if (sub==='ad'){
      const s = state.mcServer;
      if (s.crashed){ print('Sunucu çökmüş durumda. Önce "mcserver repair" ile tamir et.','bad'); return; }
      const cost = 300;
      if (state.credits < cost){ print(`Yetersiz kredi (${cost} gerekli).`,'warn'); return; }
      state.credits -= cost;
      s.adBoostUntilMin = state.gameMinutes + 3*GAME_DAY_MIN_CONST;
      print(`Reklam kampanyası başlatıldı (${cost} kredi) — 3 oyun-içi gün boyunca oyuncu büyümesi hızlanacak.`,'gold');
      updateTopbar(); save(); return;
    }
    if (sub==='event'){
      const s = state.mcServer;
      if (s.crashed){ print('Sunucu çökmüş durumda. Önce "mcserver repair" ile tamir et.','bad'); return; }
      const cost = 500;
      if (state.credits < cost){ print(`Yetersiz kredi (${cost} gerekli).`,'warn'); return; }
      state.credits -= cost;
      const t = vdsTierInfo(s.vdsTier);
      const gain = Math.round(t.maxPlayers*(0.08+Math.random()*0.12));
      s.players = Math.min(t.maxPlayers, s.players+gain);
      mcTouchPeak(s);
      print(`Özel etkinlik düzenlendi (${cost} kredi) — +${gain} yeni oyuncu katıldı!`,'gold');
      updateTopbar(); save(); return;
    }
    if (sub==='sponsor'){
      const s = state.mcServer;
      if (s.crashed){ print('Sunucu çökmüş durumda. Önce "mcserver repair" ile tamir et.','bad'); return; }
      const pickId = parseInt(parts[1],10);
      if (!pickId){
        blank(); print('YOUTUBER SPONSORLUK ANLAŞMALARI','info');
        print('Bir youtuber sunucunu tanıtırsa büyük oyuncu patlaması yaşarsın — ama VDS\'in kaldıramazsa sunucu çökebilir.','dim');
        YOUTUBERS.forEach(y=> print(`  [${y.id}] ${y.name.padEnd(18)} ${y.subs.padEnd(11)} fiyat: ${y.cost}   tahmini çökme riski: %${Math.round(y.baseCrashChance*100)}`));
        print('Kullanım: mcserver sponsor <1-3>','dim');
        return;
      }
      const y = YOUTUBERS.find(x=>x.id===pickId);
      if (!y){ print('Kullanım: mcserver sponsor <1-3>','warn'); return; }
      if (state.gameMinutes < s.lastSponsorMin + SPONSOR_COOLDOWN_MIN){
        print(`Youtuberlar sık sık aynı sunucuyu tanıtmaz — ${Math.ceil((s.lastSponsorMin+SPONSOR_COOLDOWN_MIN-state.gameMinutes)/GAME_DAY_MIN_CONST)} gün sonra tekrar sponsorluk ayarlayabilirsin.`,'warn'); return;
      }
      if (state.credits < y.cost){ print(`Yetersiz kredi (${y.cost} gerekli).`,'warn'); return; }
      state.credits -= y.cost;
      s.lastSponsorMin = state.gameMinutes;
      const t = vdsTierInfo(s.vdsTier);
      const gain = Math.round(t.maxPlayers*(y.minPct+Math.random()*(y.maxPct-y.minPct)));
      const projected = s.players+gain;
      const overflowRatio = projected>t.maxPlayers ? (projected-t.maxPlayers)/t.maxPlayers : 0;
      const crashChance = Math.min(0.92, y.baseCrashChance + overflowRatio*1.3);
      print(`${y.name} yayınında sunucunu tanıttı (${y.cost} kredi) — izleyiciler akın etti, +${gain} yeni oyuncu deneme bağlantısı yaptı.`,'gold');
      if (Math.random() < crashChance){
        s.crashed = true; s.crashedAtMin = state.gameMinutes; s.totalCrashes = (s.totalCrashes||0)+1;
        s.players = Math.max(1, Math.round(t.maxPlayers*(0.25+Math.random()*0.2)));
        s.reputation = Math.max(0, s.reputation-8);
        print(`💥 ${t.name} bu kadar ani girişi kaldıramadı — SUNUCU ÇÖKTÜ! Bağlanan oyuncuların çoğu koptu.`,'bad');
        print(`Tamir maliyeti: ${mcRepairCost(s)} kredi — "mcserver repair"`,'bad');
      } else {
        s.players = Math.min(t.maxPlayers, projected);
        s.reputation = Math.min(100, s.reputation+5);
        mcTouchPeak(s);
        print(`Sunucu yükü kaldırdı — ${s.players}/${t.maxPlayers} oyuncu şu an aktif.`,'gold');
      }
      updateTopbar(); save(); return;
    }
    if (sub==='hire'){
      const s = state.mcServer;
      const cost = MOD_BASE_COST*(s.mods+1);
      if (state.credits < cost){ print(`Yetersiz kredi (${cost} gerekli).`,'warn'); return; }
      state.credits -= cost; s.mods++;
      s.reputation = Math.min(100, s.reputation+2);
      print(`Yeni moderatör işe alındı (${cost} kredi) — artık ${s.mods} moderatörün var. Günlük bakım +${MOD_UPKEEP_PER_DAY} kredi.`,'gold');
      print('Moderatörler griefer/hile skandalı riskini azaltır ve itibarını zamanla korur.','dim');
      updateTopbar(); save(); return;
    }
    if (sub==='fire'){
      const s = state.mcServer;
      if (s.mods<=0){ print('Hiç moderatörün yok.','warn'); return; }
      s.mods--;
      print(`Bir moderatör işten çıkarıldı. Kalan: ${s.mods}. Günlük bakım -${MOD_UPKEEP_PER_DAY} kredi.`,'dim');
      updateTopbar(); save(); return;
    }
    if (sub==='shop'){
      const s = state.mcServer;
      const cur = SHOP_TIERS[s.shopTier];

      print(`  Personel: ${s.mods} moderatör`,'dim');
      print(`  Toplam griefer/hile olayı: ${s.totalGriefIncidents||0}`, (s.totalGriefIncidents||0)>0?'warn':'dim');
      print(`  Toplam çökme sayısı: ${s.totalCrashes||0}`, (s.totalCrashes||0)>0?'warn':'dim');
      print(`  Durum: ${s.crashed?'ÇÖKMÜŞ':'çalışıyor'}`, s.crashed?'bad':'hi');

    }
    if (sub==='payout'){
      const s = state.mcServer;
      if (s.crashed){ print('Sunucu çökmüş durumda, gelir toplanamıyor. Önce "mcserver repair" yap.','bad'); return; }
      const elapsedDays = (state.gameMinutes - s.lastPayoutMin)/GAME_DAY_MIN_CONST;
      if (elapsedDays < 1){ print('Henüz toplanacak yeni gelir yok — en az 1 oyun-içi gün beklemelisin.','warn'); return; }
      const t = vdsTierInfo(s.vdsTier);
      const days = Math.floor(elapsedDays);
      const income = Math.round(days*s.players*MC_MEMBERSHIP_PRICE);
      const shop = SHOP_TIERS[s.shopTier];
      const shopIncome = Math.round(days*s.players*shop.ratePerPlayerDay);
      const upkeep = Math.round(days*(t.upkeepPerDay + s.mods*MOD_UPKEEP_PER_DAY));
      const net = income+shopIncome-upkeep;

      updateTopbar(); save(); return;
    }
    print('Kullanım: mcserver | mcserver setup <1-7> | mcserver upgrade | mcserver ad | mcserver event | mcserver sponsor | mcserver hire | mcserver fire | mcserver shop | mcserver repair | mcserver stats | mcserver payout','warn');
  }
  // Organic player growth + slight random churn — advances alongside game time.
  function mcServerTick(daysPassed){
    const s = state.mcServer;
    if (!s || daysPassed<=0) return;
    mcEnsureFields(s);
    const t = vdsTierInfo(s.vdsTier);
    if (s.crashed){
      // Server down: no growth, players trickle away while it's offline.
      for (let i=0;i<daysPassed;i++){
        s.players = Math.max(0, Math.round(s.players*(1-(0.06+Math.random()*0.06))));
      }
      return;
    }
    const boosted = s.adBoostUntilMin && state.gameMinutes < s.adBoostUntilMin;
    const repMult = 0.5 + s.reputation/100; // 0.5 (itibar 0) -> 1.5 (itibar 100)
    const growthRate = (boosted?0.06:0.02) * (0.7+Math.random()*0.6) * repMult;
    const churnRate = 0.01*(0.5+Math.random()) * (2 - repMult);
    for (let i=0;i<daysPassed;i++){
      const growth = Math.round(s.players*growthRate + (boosted?randInt(Math.random,1,4):0));
      const churn = Math.round(s.players*churnRate);
      s.players = Math.max(0, Math.min(t.maxPlayers, s.players+growth-churn));
      mcTouchPeak(s);
      // Griefer / hile skandalı riski — moderatörler bu riski büyük ölçüde azaltır.
      const loadRatioForGrief = s.players/t.maxPlayers;
      const griefChance = Math.max(0, (0.05 + loadRatioForGrief*0.05) * Math.pow(0.6, s.mods));
      if (Math.random() < griefChance){
        const lost = Math.round(s.players*(0.05+Math.random()*0.1));
        s.players = Math.max(0, s.players-lost);
        s.reputation = Math.max(0, s.reputation-randInt(Math.random,4,10));
        s.totalGriefIncidents = (s.totalGriefIncidents||0)+1;
        s.lastGriefMin = state.gameMinutes;
      } else {
        s.reputation = Math.min(100, s.reputation + (s.mods>0?0.3:0.05));
      }
      // Sustained high load carries its own daily crash risk — weak/overloaded VDS can give out on its own.
      const loadRatio = s.players/t.maxPlayers;
      if (loadRatio>0.85){
        const dailyCrashChance = Math.min(0.5, (loadRatio-0.85)*1.8);
        if (Math.random() < dailyCrashChance){
          s.crashed = true; s.crashedAtMin = state.gameMinutes; s.totalCrashes = (s.totalCrashes||0)+1;
          s.players = Math.max(1, Math.round(t.maxPlayers*(0.25+Math.random()*0.2)));
          s.reputation = Math.max(0, s.reputation-8);
          break;
        }
      }
    }
  }

  // ---------- Rival NPC hackers ----------
  function spawnRivalCheck(hostname, node){
    if (session.rival) return; // only one rival at a time
    if (state.cloakCharges>0){
      state.cloakCharges--;
      print(`(Görünmezlik katmanı devrede — bu bağlantıda rakip hacker tespit edilmedi. Kalan: ${state.cloakCharges})`,'dim');
      save();
      return;
    }
    const chance = Math.min(0.6, 0.22 + node.security*0.03);
    if (Math.random() >= chance) return;
    const name = pick(Math.random, RIVAL_NAMES);
    const rp = rivalProfileFor(name);
    const ticks = Math.max(2, randInt(Math.random, 3, 5) - Math.floor(rp.lvl/2));
    session.rival = { hostname, name, ticksLeft: ticks };
    blank();
    print(`⚠ AĞ UYARISI: kimliği belirsiz bir netrunner (${name}, Lv.${rp.lvl}) bu sunucuda aktif.`,'warn');
    print(`Tahmini ${ticks} hamle içinde bir dosyayı senden önce çalabilir. Hızlı ol.`,'warn');
  }
  function rivalActiveHere(){
    return session.rival && session.rival.hostname === session.connectedIp ? session.rival : null;
  }
  function rivalProfileFor(name){
    if (!state.rivalProfiles[name]) state.rivalProfiles[name] = { wins:0, losses:0, lvl:1 };
    return state.rivalProfiles[name];
  }
  function rivalFlee(reason){
    if (!session.rival) return;
    const name = session.rival.name;
    session.rival = null;
    state.rivalsWon = (state.rivalsWon||0)+1;
    const rp = rivalProfileFor(name);
    rp.losses++; // rival lost this encounter
    if (rp.losses>0 && rp.losses%3===0){ rp.lvl++; print(`${name} seviye atladı (Lv.${rp.lvl}) — bir dahaki karşılaşma daha zorlu olacak.`,'dim'); }
    print(`${name} senin hızını fark edip ağdan çekildi.`,'hi');
    unlockAchievement('rival_outrun');
    storyProgressEvent('rival_outrun');
  }
  function rivalTick(){
    const r = rivalActiveHere();
    if (!r) return;
    r.ticksLeft--;
    if (r.ticksLeft <= 0){
      rivalSteal();
    } else if (r.ticksLeft <= 1){
      print(`⚠ ${r.name} son aşamada — kalan hamle: ${r.ticksLeft}.`,'warn');
    }
  }
  function rivalSteal(){
    const r = session.rival;
    const info = findHost(r.hostname);
    session.rival = null;
    const rp = rivalProfileFor(r.name);
    rp.wins++;
    if (!info){ save(); return; }
    const { node } = info;
    const prog = getProgress(r.hostname);
    const candidates = node.files.filter(f=> !f.isVault && !f.stolenByRival && !prog.downloaded.includes(f.name));
    if (candidates.length===0){
      print(`${r.name} eli boş ayrıldı — çalacak veri kalmamıştı.`,'dim');
      save(); return;
    }
    const f = pick(Math.random, candidates);
    f.stolenByRival = true;
    state.rivalsLost = (state.rivalsLost||0)+1;
    print(`✗ ${r.name} seni geçti — "${f.name}" dosyasını çaldı. Artık erişilemez. (Lv.${rp.lvl}, ${rp.wins} galibiyet)`,'bad');
    updateTopbar(); save();
  }

  function startRoutingPuzzle(proxyName){
    const nodes = ['A','B','C','D','E','F'];
    const rng = Math.random;
    const edges = {};
    nodes.forEach(n=> edges[n]=[]);
    const addEdge = (a,b)=>{ if (a!==b && !edges[a].includes(b)){ edges[a].push(b); edges[b].push(a); } };
    for (let i=0;i<9;i++){
      addEdge(nodes[Math.floor(rng()*nodes.length)], nodes[Math.floor(rng()*nodes.length)]);
    }
    const start='A', end='F';
    // Guarantee a path exists between start and end (BFS check; patch with a random chain if not reachable)
    function reachable(){
      const seen = new Set([start]); const q=[start];
      while(q.length){ const n=q.pop(); if(n===end) return true; edges[n].forEach(nb=>{ if(!seen.has(nb)){ seen.add(nb); q.push(nb); } }); }
      return seen.has(end);
    }
    if (!reachable()){
      const chain = shuffled(rng, nodes.filter(n=>n!==start && n!==end));
      let prev = start;
      chain.forEach(n=>{ addEdge(prev,n); prev=n; });
      addEdge(prev, end);
    }
    session.pendingRoute = { proxyName, edges, start, end, deadline: Date.now()+25000 };
    blank(); print(`ROUTING BULMACASI — ${proxyName} üzerinden güvenli yol kur`,'warn');
    print(`Başlangıç: ${start}   Hedef: ${end}   (25 saniye)`,'info');
    nodes.forEach(n=>{
      print(`  ${n} <-> ${edges[n].join(', ')||'(bağlantı yok)'}`);
    });
    print('Yol gir: path A-C-F  (A düğümünden F düğümüne bağlı düğümler üzerinden)','dim');
  }
  function resolvePendingRoute(typed){
    const pr = session.pendingRoute; session.pendingRoute = null;
    if (Date.now() > pr.deadline){ print('Süre doldu — routing başarısız.','bad'); return; }
    const seq = typed.trim().toUpperCase().split('-');
    let ok = seq.length>=2 && seq[0]===pr.start && seq[seq.length-1]===pr.end;
    if (ok){
      for (let i=0;i<seq.length-1;i++){
        if (!pr.edges[seq[i]] || !pr.edges[seq[i]].includes(seq[i+1])){ ok=false; break; }
      }
    }
    if (ok){
      session.routeChain.push(pr.proxyName);
      print(`Yol doğrulandı — ${pr.proxyName} zincire eklendi.`,'hi');
      if (session.routeChain.length>=5) unlockAchievement('route_max');
      storyProgressEvent('route_len_3', { len: session.routeChain.length });
      updateTopbar(); save();
    } else {
      print('Geçersiz yol — routing başarısız.','bad');
    }
  }

  function marketMult(itemId){
    const m = state.marketMods && state.marketMods[itemId];
    if (!m) return 1;
    if (state.gameMinutes > m.expiresAtMin){ delete state.marketMods[itemId]; return 1; }
    return m.mult;
  }
  function priceFor(itemId, base){
    let price = base*marketMult(itemId);
    const shTier = state.location && state.location.city ? safehouseBonusFor(state.location.city) : 0;
    if (shTier) price *= Math.max(0.8, 1 - Math.min(20,shTier*5)/100);
    return Math.max(1, Math.round(price));
  }

  function checkAiSubscription(silent){
    if (!state.ai.tier) return false;
    if (state.ai.tier==='root'){
      if (state.ai.lastResetDay !== currentGameDay()){
        state.ai.usedToday = 0; state.ai.chatUsedToday = 0; state.ai.lastResetDay = currentGameDay(); save();
      }
      return true;
    }
    if (state.gameMinutes > state.ai.expiresAtMin){
      const tier = state.ai.tier; const t = AI_TIERS[tier];
      if (state.ai.autoRenew && state.credits>=t.cost){
        state.credits -= t.cost;
        state.ai.rentedAtMin = state.gameMinutes; state.ai.expiresAtMin = state.gameMinutes+30*GAME_DAY_MIN;
        state.ai.usedToday = 0; state.ai.chatUsedToday = 0; state.ai.lastResetDay = currentGameDay();

        updateTopbar(); save();

        if (state.ai.autoRenew) print(`Otomatik yenileme başarısız — yetersiz kredi (${t.cost} gerekli). ${t.name} aboneliğin sona erdi.`,'warn');

      }
      state.ai = defaultAiState();
      save();
      return false;
    }
    if (state.ai.lastResetDay !== currentGameDay()){
      state.ai.usedToday = 0;
      state.ai.chatUsedToday = 0;
      state.ai.lastResetDay = currentGameDay();
      save();
    }

  }

  function classifyChat(q){
    if (/selam|merhaba|naber|nasılsın|nasilsin|hey\b|\bhi\b/.test(q)) return 'greet';
    if (/kimsin|adın ne|adin ne|sen kimsin|nesin sen/.test(q)) return 'who';
    if (/teşekkür|tesekkur|sağol|sagol|eyvallah|eyw/.test(q)) return 'thanks';
    if (/aptal|salak|gerizekalı|gerizekali|serseri|işe yaramaz/.test(q)) return 'insult';
    if (/görüşürüz|gorusuruz|bay bay|hoşçakal|hoscakal/.test(q)) return 'bye';
    if (/şaka|saka\b|fıkra|fikra|güldür|guldur|komik bir şey/.test(q)) return 'joke';
    if (/sıkıldım|sikildim|yorgunum|kötü hissediyorum|kotu hissediyorum|moralim bozuk|canım sıkkın/.test(q)) return 'mood';
    if (/hayatın anlamı|hayatin anlami|felsefe|anlamı ne/.test(q)) return 'philosophy';
    if (/harikasın|harikasin|süpersin|supersin|iyisin sen|güzelsin/.test(q)) return 'compliment';
    if (/seni kim yaptı|seni kim yapti|gerçek misin|gercek misin|yapay zeka mısın|yapay zeka misin|kim geliştirdi|kim gelistirdi/.test(q)) return 'meta';
    return 'fallback';

  // Kelime başı sabit değil — kategoriye göre değişen bir aralıktan rastgele token maliyeti + uzun mesajlarda küçük ek ücret.
  const CHAT_TOKEN_COST = {
    greet:[3,6], who:[4,8], thanks:[2,4], insult:[3,7], bye:[2,4],
    joke:[6,12], mood:[5,10], philosophy:[10,20], compliment:[3,6],
    meta:[6,13], fallback:[5,15]
  };
  function chatTokenCost(category, question){
    const range = CHAT_TOKEN_COST[category] || CHAT_TOKEN_COST.fallback;
    let cost = randInt(Math.random, range[0], range[1]);
    const wc = question.split(/\s+/).filter(Boolean).length;
    if (wc>12) cost += Math.min(15, Math.floor((wc-12)/3)); // uzun mesaj = biraz daha pahalı, ama katı kelime-başı çarpım değil
    return cost;
  }

  // SIGMA-X (power 4): tek komutla bağlı olunan şirketin TÜM ağını (gateway + her node + her port + her vault) ele geçirir.

    }
    if (company.isMega && tier==='root'){

      }

      blank();
    }
    print(`${name}: "${company.name}" için TAM AĞ ELE GEÇİRME protokolü başlatılıyor...`,'gold');
    print(`(Kurumsal güvenlik derecesi ${company.security}/10 tespit edildi — ${AI_TIERS[tier].name} için önemsiz.)`,'dim');

      node.files.forEach(f=>{

    blank();
    print(`${name}: OPERASYON TAMAM — ${stage} aşama tek seferde otomatik geçildi. ${filesTaken} dosya (${vaultsTaken} vault dahil) çalındı.`,'gold');

  // Serbest metinle soru anlama (power 2+ için daha detaylı, power 4 en derin).
  function aiUnderstand(question, power){
    const q = question.toLowerCase();
    const lines = [];
    const deep = power>=3;
    if (/kredi|para|zengin|kazan/.test(q)){
      lines.push(`Şu an ${state.credits} kredin var.`);
      if (deep) lines.push('Hızlı kazanç: dosya sat ("sell"), vault dosyalarını çöz, "safehouse" ya da "mcserver" ile pasif gelir kur.');
    } else if (/\biz\b|trace|yakala|ids|alarm/.test(q)){
      const t = Math.round(session.trace||0);
      lines.push(`Mevcut izin: %${t}.${t>=70?' Kritik seviyeye yakın!':''}`);
      if (deep) lines.push('İzi düşürmek için: bağlıyken "wipelogs", "route add" ile proxy zinciri kur, ya da karaborsadan cloak/shield satın al.');
    } else if (/hedef|nereye|ne yapmalıyım|ne yapayım|sıradaki|başla/.test(q)){
      lines.push(...computeHint());
    } else if (/rakip|rival/.test(q)){
      const names = Object.keys(state.rivalProfiles||{});
      if (names.length===0) lines.push('Henüz kayıtlı bir rakip hacker karşılaşman yok.');
      else names.forEach(n=>{ const rp=state.rivalProfiles[n]; lines.push(`${n}: Lv.${rp.lvl}  (${rp.wins} el kazandı, ${rp.losses} kez kaçtı)`); });
    } else if (/fraksiyon|faction|itibar/.test(q)){
      if (!state.faction) lines.push('Henüz bir fraksiyona katılmadın: "factions" ile listeye bak, "join <ad>" ile katıl.');
      else { lines.push(`Fraksiyonun: ${state.faction}.`); FACTIONS.forEach(f=> lines.push(`  ${f.name}: ${state.rep[f.id]} puan (${repTier(state.rep[f.id])})`)); }
    } else if (/vault/.test(q)){
      const info = session.connectedIp ? findHost(session.connectedIp) : null;
      if (!info || info.node.isGateway) lines.push('Şu an bir vault dosyasına bağlı değilsin. Bir node\'a bağlanıp "ls" ile dosyaları listele.');
      else {
        const prog = getProgress(session.connectedIp);
        const vault = info.node.files.find(f=>f.isVault && prog.cracked.includes(f.gatePort) && !prog.downloaded.includes(f.name) && !f.stolenByRival);
        lines.push(vault ? `"${vault.name}" hazır: "inject ${vault.name}" ile syntax bulmacasını başlat.` : 'Bu node\'da şu an erişilebilir açık bir vault yok.');
      }
    } else if (/görev|mission|misyon/.test(q)){
      lines.push(state.activeMission ? `Aktif görevin var: "missions" yazarak detayına bak.` : 'Şu an aktif bir görevin yok: "missions" ile listeye bak.');
    } else {
      lines.push(...computeHint());
      if (deep) lines.push('Daha spesifik bir şey sormak istersen "ask <sorun>" şeklinde yaz — örn: "ask param nasıl artar", "ask iz ne durumda".');
    }
    return lines;
  }
  function cmdAsk(question){
    if (!checkAiSubscription()) return;
    const tier = state.ai.tier;
    const power = AI_TIERS[tier].power; // 1=lite 2=mid 3=omega 4=sigma
    const name = AI_TIERS[tier].name;
    const question_ = (question||'').trim();
    const hasPendingPuzzle = !!(session.pendingCrack || session.pendingFirewall || session.pendingTrace || session.pendingInject);
    const isGameQuery = hasPendingPuzzle || !question_ || isGameTopic(question_);

    // ---- Düz sohbet yolu: ayrı token havuzu, günlük soru hakkını tüketmez ----
    if (!isGameQuery){
      const budget = AI_TIERS[tier].chatTokenBudget;
      const category = classifyChat(question_.toLowerCase());
      const cost = chatTokenCost(category, question_);
      if (!session.devAiUnlimited && state.ai.chatUsedToday + cost > budget){
        const left = Math.max(0, budget - state.ai.chatUsedToday);
        print(`${name}: bu cevap ~${cost} token tutuyor ama sadece ${left} token'ın kaldı. Bugünlük sohbet bitti sayılır, yarın sıfırlanır. (Oyunla ilgili sorular ayrı haktan düşer, onu hâlâ kullanabilirsin.)`,'warn');
        return;
      }
      const reply = aiChatReply(tier, category);
      blank(); print(`${name}: ${reply}`,'gold');
      if (!session.devAiUnlimited) state.ai.chatUsedToday += cost;
      print(`(-${session.devAiUnlimited?0:cost} token · kalan sohbet tokeni: ${session.devAiUnlimited?'∞':budget-state.ai.chatUsedToday}/${session.devAiUnlimited?'∞':budget})`,'dim');
      updateTopbar(); save();
      return;
    }

    // ---- Oyun sorusu / bulmaca çözme yolu: günlük soru hakkından düşer ----
    if (!session.devAiUnlimited && state.ai.usedToday >= AI_TIERS[tier].dailyLimit){
      print(`Bugünkü soru hakkın bitti (${AI_TIERS[tier].dailyLimit}/gün). Yarın sıfırlanır. ("hint" ile normal ipucu kullanabilirsin, ya da oyun dışı bir şey sorup sohbet tokenini kullanabilirsin.)`,'warn');
      return;
    }

    // AI mid-tier (NetSage-7) attempts auto-solves but can fail by chance on hard targets / BLACK ICE.
    // AI omega-tier (OMEGA-9) is near-flawless and always succeeds.
    function aiMidSuccessChance(node){
      const effSec = node ? effectiveSecurity(session.connectedIp, node.security) : 5;
      let chance = 0.9 - effSec*0.045; // harder security = more likely to fail
      if (node && node.hasBlackIce) chance -= 0.22;
      return Math.max(0.35, Math.min(0.95, chance));
    }
    if (session.pendingCrack){
      const pc = session.pendingCrack;
      if (power===1){ print(`${name}: kod şu -> ${pc.code}  (süre dolmadan sen yazmalısın)`,'gold'); }
      else {
        const info = findHost(session.connectedIp);
        const aiFails = (power===2) && Math.random() > aiMidSuccessChance(info.node);
        session.pendingCrack = null;
        if (aiFails){
          traceGainOnFailure(info.node.security*(pc.blackIce?9:12)*(pc.blackIce?1.6:1));
          print(`${name}: breach denemesi BAŞARISIZ oldu — hedef çok sağlam korunuyor.`,pc.blackIce?'bad':'warn');
          if (pc.blackIce) print('BLACK ICE karşı saldırı gönderdi — ek iz bırakıldı.','bad');
        } else {
          getProgress(session.connectedIp).cracked.push(pc.port);
          traceGain(info.node.security*(power===3?0.4:1.2));
          print(`${name}: port ${pc.port} anında kırıldı.`,'gold');
          unlockAchievement('first_crack');
        }
        rivalTick(); updateTopbar();
      }
    } else if (session.pendingFirewall){
      const pf = session.pendingFirewall;
      if (power===1){ print(`${name}: aşama ${pf.stage+1} kodu -> ${pf.codes[pf.stage]}`,'gold'); }
      else if (power===2){
        const info = findHost(session.connectedIp);
        if (Math.random() > aiMidSuccessChance(info.node)){
          session.pendingFirewall = null;
          traceGainOnFailure(info.node.security*9*(pf.blackIce?1.6:1));
          print(`${name}: aşama ${pf.stage+1} denemesi BAŞARISIZ oldu — firewall breach çöktü. Baştan denemelisin.`,'bad');
          updateTopbar(); save();
        } else {
          print(`${name}: aşama ${pf.stage+1} otomatik geçildi.`,'gold');
          resolvePendingFirewall(pf.codes[pf.stage]);
        }
      } else {
        while (session.pendingFirewall){
          const cur = session.pendingFirewall;
          resolvePendingFirewall(cur.codes[cur.stage]);
        }
        print(`${name}: tüm firewall aşamaları anında geçildi.`,'gold');
      }
    } else if (session.pendingTrace){
      const pt = session.pendingTrace;
      if (power===1){ print(`${name}: paket imzası -> ${pt.code}`,'gold'); }
      else {
        print(`${name}: iz sürme anında tamamlandı.`,'gold');
        resolvePendingTrace(pt.code);
      }
    } else if (session.pendingInject){
      const pi = session.pendingInject;
      if (power===1){ print(`${name}: ilk token -> ${pi.seq[0]}`,'gold'); }
      else {
        print(`${name}: syntax bulmacası anında çözüldü.`,'gold');
        cmdInjectSubmit(pi.seq.join(' '));
      }
    } else if (power>=4 && (!question_ || /autohack|tüm ağ|tum ag|şirketi ele geçir|sirketi ele gecir|hepsini|network|full hack/i.test(question_))){
      aiSigmaAutohack(name, tier);
    } else if (question_){
      const answer = aiUnderstand(question_, power);
      blank(); print(`${name} DİYOR Kİ:`,'gold');
      answer.forEach(line=> print('  '+line,'hi'));
    } else {
      const advice = computeHint();
      blank(); print(`${name} DİYOR Kİ:`,'gold');
      advice.forEach(line=> print('  '+line,'hi'));
    }
    if (!session.devAiUnlimited) state.ai.usedToday++;
    print(`(bugün kalan soru: ${session.devAiUnlimited?'∞':AI_TIERS[tier].dailyLimit-state.ai.usedToday}/${session.devAiUnlimited?'∞':AI_TIERS[tier].dailyLimit})`,'dim');
    updateTopbar(); save();
  }

  function computeHint(){
    // Pending code-entry states take priority regardless of mode
    if (session.pendingModeSelect) return ['Önce bir rol seç: "1" (HACKER) ya da "2" (SİBER GÜVENLİK) yaz.'];
    if (session.pendingCrack) return ['Ekrandaki diziyi süresi dolmadan aynen (büyük harfle) yazıp Enter\'a bas.'];
    if (session.pendingFirewall) return ['Ekrandaki aşama kodunu aynen yazıp Enter\'a bas — sırayla tüm aşamaları geçmelisin.'];
    if (session.pendingTrace) return ['Ekrandaki paket imzasını süresi dolmadan aynen yazıp Enter\'a bas.'];
    if (session.pendingRoute) return ['Route bulmacasını tamamlamak için istenen adımı gir.'];
    if (session.pendingInject) return ['Vault için doğru syntax token\'ını "inject_submit <token>" ile gönder.'];

    if (state.mode === 'defender') return computeHintDefender();
    return computeHintHacker();
  }
  function computeHintHacker(){
    if (!state.location.region) return ['Henüz hiçbir bölgeye gitmedin: "worldmap" yaz, sonra "region <ad>" ile bir bölgeye gir.'];
    if (!state.location.city) return [`${state.location.region} bölgesindesin ama henüz bir şehre girmedin: "city <ad>" ile bir şehre gir.`];
    if (!session.connectedIp){
      return ['Bir şehirdesin ama hiçbir ağa bağlı değilsin: "targets" ile şirketleri gör, sonra "connect <hostname>" ile gateway\'ine bağlan (gateway hostname\'i genelde "gateway.<şirket>.corp").'];
    }
    const info = findHost(session.connectedIp);
    if (!info) return ['Bağlantı durumun bozulmuş görünüyor: "disconnect" yazıp yeniden "connect <hostname>" dene.'];
    const { node, company } = info;
    if (node.isGateway){
      const prog = getProgress(session.connectedIp);
      if (!prog.cracked.includes(9999)) return ['Şu an bir GATEWAY\'e bağlısın ve o hâlâ kırılmamış: "firewall 9999" yaz ve çıkan kodları sırayla gir.'];
      return [`Bu gateway zaten kırılmış — "netmap ${company.name}" ile iç ağdaki node\'ları gör, sonra "connect <iç node hostname>" ile içeri gir.`];
    }
    if (!isGatewayBreached(company.slug)) return [`${company.name} gateway'i hâlâ aktif: önce "connect gateway.${company.slug}.corp" ile bağlan, sonra "firewall 9999" ile kır.`];
    const prog = getProgress(session.connectedIp);
    const lockedPorts = node.ports.filter(p=>!prog.cracked.includes(p.port));
    if (lockedPorts.length>0){
      const p = lockedPorts[0];
      return [`Bu node'da hâlâ kilitli port var: "crack ${p.port}" dene (ya da önce "vulnscan" çalıştırıp "exploit ${p.port}" ile sessiz yöntemi kullan).`];
    }
    const visible = node.files.filter(f=>prog.cracked.includes(f.gatePort));
    const vault = visible.find(f=>f.isVault && !prog.downloaded.includes(f.name) && !f.stolenByRival);
    if (vault) return [`"${vault.name}" bir VAULT dosyası: "cat ${vault.name}" ile bak, sonra "inject" ile syntax bulmacasını çöz.`];
    const undownloaded = visible.find(f=>!f.isVault && !prog.downloaded.includes(f.name) && !f.stolenByRival);
    if (undownloaded) return [`"download ${undownloaded.name}" ile bu dosyayı envanterine al.`];
    if (visible.length>0) return ['Bu node\'daki tüm dosyaları zaten aldın. "pivot <hostname>" ile aynı şirketin başka bir node\'una geç ya da "disconnect" ile başka bir hedefe yönel.'];
    return ['Bu node boş görünüyor. "pivot <hostname>" ile aynı şirketteki başka bir node\'a geç ya da "disconnect" edip yeni bir hedef bul.'];
  }
  function computeHintDefender(){
    if (state.secContracts.length===0){
      return state.location.city
        ? ['Henüz hiçbir şirketle sözleşmen yok: "contracts" ile listeyi gör, "defend <şirket>" ile sözleşme yap.']

    if (!activeInc.traced) return [`Olayı izlemek için: "trace ${activeInc.id}" yaz ve çıkan paket imzasını gir.`];
    return [`Saldırgan izlendi: "neutralize ${activeInc.id}" ile etkisiz hale getir (ya da "patch ${activeInc.hostname} ${activeInc.port}" ile portu kapat).`];
  }

  function storyProgressEvent(kind, ctx){
    if (!state.faction) return;
    const chain = STORY_CHAINS[state.faction];
    if (!chain || state.completedChains.includes(state.faction)) return;
    if (!state.storyMissions[state.faction]) return; // henüz "storyline" ile başlatılmamış
    const sm = state.storyMissions[state.faction];
    const stage = chain.stages[sm.stage];
    if (!stage || stage.kind!==kind) return;
    let ok = true;
    if (kind==='sell_value_400' && (!ctx || ctx.value<400)) ok=false;
    if (kind==='harden_lvl2' && (!ctx || ctx.lvl<2)) ok=false;
    if (kind==='fence_lvl1' && (!ctx || ctx.lvl<1)) ok=false;
    if (kind==='route_len_3' && (!ctx || ctx.len<3)) ok=false;
    if (kind==='sell_count_3'){
      sm.sellCount = (sm.sellCount||0)+1;
      if (sm.sellCount<3) return;
    }
    if (!ok) return;
    const reward = stage.reward;
    state.credits += reward; addEarnings(reward);
    state.rep[state.faction] = (state.rep[state.faction]||0) + stage.repGain;
    blank();
    print(`📖 HİKAYE — ${chain.name} — aşama ${sm.stage+1} tamamlandı! +${reward} kredi, +${stage.repGain} itibar.`,'gold');
    sm.stage++;
    if (sm.stage>=chain.stages.length){
      state.completedChains.push(state.faction);
      delete state.storyMissions[state.faction];
      print(`🏆 "${chain.name}" hikaye hattı tamamlandı!`,'gold');
      unlockAchievement('story_complete');
    } else {
      print(`Sıradaki aşama: ${chain.stages[sm.stage].desc}`,'hi');
    }
    updateTopbar(); save();
  }

  function nodeDefenseFor(hostname){
    if (!state.nodeDefense[hostname]) state.nodeDefense[hostname] = { hardenLvl: 0, patchedPorts: [] };
    return state.nodeDefense[hostname];
  }
  function companyDefenseAvg(co){
    let sum=0, count=0;
    co.nodes.forEach(n=>{ const nd = state.nodeDefense[n.hostname]; if (nd){ sum+=nd.hardenLvl; count++; } });
    return count ? sum/count : 0;
  }
  function findIncident(ref){
    if (!ref) return null;
    const r = ref.trim().toLowerCase();
    let inc = state.activeIncidents.find(i=>i.id.toLowerCase()===r);
    if (inc) return inc;
    inc = state.activeIncidents.find(i=>i.hostname.toLowerCase().includes(r));
    if (inc) return inc;
    return state.activeIncidents.find(i=>i.companyName.toLowerCase().includes(r)) || null;
  }
  function spawnIncident(co){
    const nodes = co.nodes.filter(n=>!n.isGateway && n.ports && n.ports.length);
    if (!nodes.length) return;
    const node = pick(Math.random, nodes);
    const nd = nodeDefenseFor(node.hostname);
    if (state.honeypots[node.hostname]){
      // Honeypot yakaladı — gerçek olaya dönüşmeden saldırgan tuzağa düşer
      const attacker = pick(Math.random, RIVAL_NAMES);
      const fp = forensicsFor(attacker);
      fp.seen++; fp.profileLvl = Math.min(3, Math.floor(fp.seen/2));
      const reward = 60 + randInt(Math.random,20,60);
      state.credits += reward; addEarnings(reward);
      blank();
      print(`🍯 HONEYPOT TETİKLENDİ — ${node.hostname} üzerindeki tuzak ${attacker} adlı saldırganı yakaladı. +${reward} kredi, saldırı gerçek sisteme ulaşmadı.`,'gold');
      updateTopbar(); save();
      return;
    }
    const availPorts = node.ports.filter(p=>!nd.patchedPorts.includes(p.port));
    if (!availPorts.length) return;
    const p = pick(Math.random, availPorts);
    const attacker = pick(Math.random, RIVAL_NAMES);
    const skill = randInt(Math.random, 3, 9);
    const fp = forensicsFor(attacker);
    const inc = {
      id: 'INC-'+String(state.incidentSeq++).padStart(3,'0'),
      hostname: node.hostname, companySlug: co.slug, companyName: co.name,
      port: p.port, service: p.service, attacker, skill,
      intrusion: randInt(Math.random,5,15), investigated: fp.profileLvl>=2, traced:false
    };
    state.activeIncidents.push(inc);
    blank();
    const earlyWarn = state.analysts>0 || fp.profileLvl>0;
    print(`⚠ YENİ OLAY: ${co.name} — ${node.hostname} üzerinde şüpheli aktivite (port ${p.port}/${p.service}${earlyWarn?`, saldırgan: ${attacker}`:''}).`,'warn');
    if (fp.profileLvl>=2) print(`(Adli profil sayesinde ${attacker} otomatik olarak incelendi.)`,'dim');
    print(`"soc" ile detayları gör.`,'dim');
  }
  function cmdHoneypot(arg){
    if (!arg){ print('Kullanım: honeypot <hostname>','warn'); return; }
    const info = findHost(arg);
    if (!info){ print('Hedef bulunamadı.','warn'); return; }
    if (!state.secContracts.includes(info.company.slug)){ print('Bu şirketle sözleşmen yok.','warn'); return; }
    if (state.honeypots[arg]){ print('Bu sunucuda zaten bir honeypot kurulu.','dim'); return; }
    const cost = 300;
    if (state.credits<cost){ print(`Yetersiz kredi (${cost} gerekli).`,'warn'); return; }
    state.credits -= cost;
    state.honeypots[arg] = true;
    print(`Honeypot kuruldu: ${arg}. Bu sunucuya yönelik saldırılar artık otomatik yakalanacak. -${cost} kredi.`,'hi');
    updateTopbar(); save();
  }
  async function breachOccurs(inc){
    if (state.backupCharges>0){
      state.backupCharges--;
      inc.intrusion = 0;
      blank();
      print(`🛡 YEDEKLEME SİSTEMİ DEVREYE GİRDİ — ${inc.hostname} ihlali son anda engellendi, ceza yok. Kalan yedekleme: ${state.backupCharges}`,'gold');
      updateTopbar(); save();
      return;
    }
    state.activeIncidents = state.activeIncidents.filter(i=>i!==inc);
    state.breachesFailed = (state.breachesFailed||0)+1;
    blank();
    print(`!!! İHLAL GERÇEKLEŞTİ !!! ${inc.hostname} — ${inc.attacker} sızmayı tamamladı.`,'bad');
    if (state.hardcore){
      print('☠☠☠ HARDCORE MOD — MÜŞTERİ SÖZLEŞMEN İPTAL EDİLDİ. ☠☠☠','bad');
      const deadSlot = activeSlot;
      print(`Slot ${deadSlot} kalıcı olarak silindi. Bu kariyer geri gelmeyecek.`,'bad');
      state = DEFAULT_STATE('defender');
      resetSessionForSlotSwitch();
      updatePrompt(); updateTopbar();

      await save();
      print(`"newgame ${deadSlot}" ile bu slotta yeniden başlayabilir, ya da "slots" ile diğer slotlara bakabilirsin.`,'warn');
      return;
    }
    const penalty = Math.floor(state.credits*0.2);
    state.credits -= penalty;
    print(`Müşteri veri kaybı yaşadı. -${penalty} kredi ceza.`,'bad');
    print('Bu şirket bir süreliğine seni yakından izleyecek.','warn');
    updateTopbar(); save();
  }
  function defenderTick(){

    blank(); print(`İZ SÜRME — ${inc.attacker}`,'warn');
    print(`${timeLimit} saniye içinde aşağıdaki paket imzasını TAM olarak yaz:`,'info');

  function resolvePendingTrace(typed){
    const pt = session.pendingTrace; session.pendingTrace = null;
    const inc = state.activeIncidents.find(i=>i.id===pt.incId);
    if (!inc){ print('Olay artık aktif değil.','dim'); return; }
    const late = Date.now() > pt.deadline;
    if (!late && typed.trim().toUpperCase()===pt.code){
      inc.traced = true;
      const loc = pick(Math.random, proxyCityNames);
      print(`İZ TAMAMLANDI — ${inc.attacker} konumu ${loc} üzerinden yönlendiriliyor.`,'hi');
      print(`Artık "neutralize ${inc.id}" ile etkisiz hale getirebilirsin.`,'dim');
      unlockAchievement('first_trace');
    } else {
      inc.intrusion = Math.min(100, inc.intrusion + randInt(Math.random,8,15));
      print(late?'SÜRE DOLDU — iz kayboldu.':'İMZA HATALI — iz kayboldu.','bad');
      print(`${inc.attacker} fark etti ve hızlandı.`,'warn');
      if (inc.intrusion>=100){ breachOccurs(inc); return; }
    }
    updateTopbar(); save();
  }
  function cmdPatch(arg){
    const parts = arg.split(/\s+/).filter(Boolean);
    if (parts.length<2){ print('Kullanım: patch <hostname> <port>','warn'); return; }
    const hostname = parts[0]; const port = parseInt(parts[1],10);
    const info = findHost(hostname);
    if (!info){ print('Hedef bulunamadı.','warn'); return; }
    if (!state.secContracts.includes(info.company.slug)){ print('Bu şirketle sözleşmen yok.','warn'); return; }
    const nd = nodeDefenseFor(hostname);
    if (nd.patchedPorts.includes(port)){ print('Bu port zaten yamalı.','dim'); return; }
    const cost = 60 + info.node.security*15;
    if (state.credits<cost){ print(`Yetersiz kredi (${cost} gerekli).`,'warn'); return; }
    state.credits -= cost;
    nd.patchedPorts.push(port);
    print(`Yama uygulandı: ${hostname} port ${port}. -${cost} kredi.`,'hi');
    const inc = state.activeIncidents.find(i=>i.hostname===hostname && i.port===port);
    if (inc){
      state.activeIncidents = state.activeIncidents.filter(i=>i!==inc);
      const reward = 80 + info.node.security*20;
      state.credits += reward; addEarnings(reward);
      state.incidentsResolved = (state.incidentsResolved||0)+1;
      print(`Saldırgan (${inc.attacker}) portun kapatılmasıyla bağlantısını kaybetti. Olay çözüldü. +${reward} kredi.`,'hi');
      unlockAchievement('first_patch');
    }
    updateTopbar(); save();
  }

  function cmdNeutralize(arg){
    if (!arg){ print('Kullanım: neutralize <olay id / hostname>','warn'); return; }
    const inc = findIncident(arg);
    if (!inc){ print('Böyle bir aktif olay yok.','warn'); return; }

      state.credits += reward; addEarnings(reward);
      state.rep.whitehat = (state.rep.whitehat||0)+15;
      state.incidentsResolved = (state.incidentsResolved||0)+1;
      state.activeIncidents = state.activeIncidents.filter(i=>i!==inc);
      const fp = forensicsFor(inc.attacker);
      fp.seen++; fp.profileLvl = Math.min(3, Math.floor(fp.seen/2));
      print(`ETKİSİZ HALE GETİRİLDİ — ${inc.attacker} yakalandı. +${reward} kredi, +15 itibar (Whitehat Underground).`,'hi');

      unlockAchievement('first_neutralize');
      storyProgressEvent('neutralize_traced');
    } else {
      const success = Math.random() < 0.45;

        state.incidentsResolved = (state.incidentsResolved||0)+1;

        print(`Riskli müdahale başarılı — ${inc.attacker} sistemden atıldı ama kaçtı. +${reward} kredi.`,'hi');

        inc.intrusion = Math.min(100, inc.intrusion+25);

  function showToast(opts){
    const wrap = document.createElement('div'); wrap.className = 'achToast';
    if (opts.color){ wrap.style.borderColor = opts.color; wrap.style.color = opts.color; wrap.style.boxShadow = `0 0 20px ${opts.color}55`; }
    const head = document.createElement('div'); head.className = 'achToastHead';
    head.appendChild(makeIconCanvas(opts.icon||'star', 22));
    const t = document.createElement('span'); t.textContent = opts.title;
    head.appendChild(t); wrap.appendChild(head);
    const m = document.createElement('div'); m.className = 'achToastMsg'; m.textContent = opts.msg;
    wrap.appendChild(m);
    document.body.appendChild(wrap);
    setTimeout(()=> wrap.remove(), 4200);
  }

  function addEarnings(amount){
    if (!state.totalEarned) state.totalEarned = 0;
    const before = rankIndex(state.totalEarned);
    state.totalEarned += amount;
    const after = rankIndex(state.totalEarned);
    if (after > before){
      const title = rankTitle(state.totalEarned);
      showToast({title:'RÜTBE ATLANDI', msg: title, icon:'chevron', color:'#ffd76a'});
      print(`✦ RÜTBE ATLANDI: ${title}`,'gold');
    }
    if (state.totalEarned >= 1000) unlockAchievement('credits_1000');
    if (state.totalEarned >= 10000) unlockAchievement('credits_10000');
  }

  function unlockAchievement(id){
    if (!state.achievements) state.achievements = {};
    if (state.achievements[id]) return;
    state.achievements[id] = true;

  function drawIcon(ctx, type, size){
    ctx.save();
    ctx.strokeStyle = '#33ff5a'; ctx.fillStyle = '#33ff5a';
    ctx.lineWidth = Math.max(1.2, size*0.06);
    ctx.shadowColor = '#33ff5a'; ctx.shadowBlur = 4;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const c = size/2;
    switch(type){
      case 'globe':
        ctx.beginPath(); ctx.arc(c,c,size*0.36,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(c,c,size*0.36,size*0.15,0,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c,c-size*0.36); ctx.lineTo(c,c+size*0.36); ctx.stroke();
        break;
      case 'plug':
        ctx.strokeRect(c-size*0.18,c-size*0.06,size*0.36,size*0.28);
        ctx.beginPath(); ctx.moveTo(c-size*0.09,c-size*0.06); ctx.lineTo(c-size*0.09,c-size*0.24); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c+size*0.09,c-size*0.06); ctx.lineTo(c+size*0.09,c-size*0.24); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c,c+size*0.22); ctx.lineTo(c,c+size*0.36); ctx.stroke();
        break;
      case 'lock':
        ctx.strokeRect(c-size*0.2,c-size*0.02,size*0.4,size*0.3);
        ctx.beginPath(); ctx.arc(c,c-size*0.08,size*0.16,Math.PI,Math.PI*1.85); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c-size*0.05,c+size*0.06); ctx.lineTo(c+size*0.05,c+size*0.16); ctx.lineTo(c-size*0.02,c+size*0.24); ctx.stroke();
        break;
      case 'file':
        ctx.beginPath();
        ctx.moveTo(c-size*0.2,c-size*0.32); ctx.lineTo(c+size*0.08,c-size*0.32); ctx.lineTo(c+size*0.2,c-size*0.2);
        ctx.lineTo(c+size*0.2,c+size*0.32); ctx.lineTo(c-size*0.2,c+size*0.32); ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c-size*0.1,c-size*0.04); ctx.lineTo(c+size*0.1,c-size*0.04);
        ctx.moveTo(c-size*0.1,c+size*0.1); ctx.lineTo(c+size*0.1,c+size*0.1); ctx.stroke();
        break;
      case 'mask':
        ctx.beginPath(); ctx.ellipse(c-size*0.15,c,size*0.13,size*0.09,0,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(c+size*0.15,c,size*0.13,size*0.09,0,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c-size*0.02,c); ctx.lineTo(c+size*0.02,c); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c-size*0.34,c-size*0.03); ctx.quadraticCurveTo(c-size*0.42,c-size*0.15,c-size*0.3,c-size*0.22); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c+size*0.34,c-size*0.03); ctx.quadraticCurveTo(c+size*0.42,c-size*0.15,c+size*0.3,c-size*0.22); ctx.stroke();
        break;
      case 'cart':
        ctx.strokeRect(c-size*0.22,c-size*0.14,size*0.36,size*0.22);
        ctx.beginPath(); ctx.moveTo(c-size*0.3,c-size*0.26); ctx.lineTo(c-size*0.22,c-size*0.14); ctx.stroke();
        ctx.beginPath(); ctx.arc(c-size*0.14,c+size*0.22,size*0.05,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(c+size*0.08,c+size*0.22,size*0.05,0,Math.PI*2); ctx.stroke();
        break;
      case 'flag':
        ctx.beginPath(); ctx.moveTo(c-size*0.2,c-size*0.34); ctx.lineTo(c-size*0.2,c+size*0.34); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c-size*0.2,c-size*0.3); ctx.lineTo(c+size*0.26,c-size*0.2); ctx.lineTo(c-size*0.2,c-size*0.06); ctx.closePath(); ctx.stroke();
        break;
      case 'target':
        ctx.beginPath(); ctx.arc(c,c,size*0.34,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(c,c,size*0.16,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c,c-size*0.42); ctx.lineTo(c,c+size*0.42); ctx.moveTo(c-size*0.42,c); ctx.lineTo(c+size*0.42,c); ctx.stroke();
        break;
      case 'terminal':
        ctx.strokeRect(c-size*0.32,c-size*0.24,size*0.64,size*0.48);
        ctx.beginPath(); ctx.moveTo(c-size*0.2,c-size*0.08); ctx.lineTo(c-size*0.06,c); ctx.lineTo(c-size*0.2,c+size*0.08); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c,c+size*0.1); ctx.lineTo(c+size*0.16,c+size*0.1); ctx.stroke();
        break;
      case 'star':
        ctx.beginPath();
        for(let i=0;i<5;i++){
          const ang = -Math.PI/2 + i*(Math.PI*2/5);
          const ang2 = ang + Math.PI/5;
          const x1 = c+Math.cos(ang)*size*0.36, y1 = c+Math.sin(ang)*size*0.36;
          const x2 = c+Math.cos(ang2)*size*0.15, y2 = c+Math.sin(ang2)*size*0.15;
          if (i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1);
          ctx.lineTo(x2,y2);
        }
        ctx.closePath(); ctx.stroke();
        break;
      case 'trophy':
        ctx.beginPath(); ctx.moveTo(c-size*0.18,c-size*0.3); ctx.lineTo(c+size*0.18,c-size*0.3); ctx.lineTo(c+size*0.14,c+size*0.02);
        ctx.quadraticCurveTo(c,c+size*0.14,c-size*0.14,c+size*0.02); ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c-size*0.18,c-size*0.26); ctx.quadraticCurveTo(c-size*0.38,c-size*0.26,c-size*0.3,c-size*0.06); ctx.quadraticCurveTo(c-size*0.26,c+size*0.02,c-size*0.14,c+size*0.02); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c+size*0.18,c-size*0.26); ctx.quadraticCurveTo(c+size*0.38,c-size*0.26,c+size*0.3,c-size*0.06); ctx.quadraticCurveTo(c+size*0.26,c+size*0.02,c+size*0.14,c+size*0.02); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c,c+size*0.14); ctx.lineTo(c,c+size*0.26); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c-size*0.16,c+size*0.34); ctx.lineTo(c+size*0.16,c+size*0.34); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c-size*0.1,c+size*0.26); ctx.lineTo(c+size*0.1,c+size*0.26); ctx.stroke();
        break;
      case 'chevron':
        ctx.beginPath(); ctx.moveTo(c-size*0.28,c-size*0.02); ctx.lineTo(c,c-size*0.28); ctx.lineTo(c+size*0.28,c-size*0.02); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(c-size*0.28,c+size*0.26); ctx.lineTo(c,c); ctx.lineTo(c+size*0.28,c+size*0.26); ctx.stroke();
        break;
    }
    ctx.restore();
  }
  const iconCache = new Map();
  function makeIconCanvas(type, size){
    const key = type + '_' + size;
    let url = iconCache.get(key);
    if (!url){
      const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
      drawIcon(cv.getContext('2d'), type, size);
      url = cv.toDataURL();
      iconCache.set(key, url);
    }
    const img = document.createElement('img');
    img.src = url; img.width = size; img.height = size;
    img.style.width = size+'px'; img.style.height = size+'px'; img.style.display = 'inline-block';
    return img;
  }

  function saveNewMacro(){
    const nameEl = document.getElementById('macroNameInput');
    const cmdEl = document.getElementById('macroCmdInput');
    const name = nameEl.value.trim();
    const cmd = cmdEl.value.trim();
    if (!name){ alert('1. Makro adını gir.'); nameEl.focus(); return; }
    if (!cmd){ alert('2. Basınca çalışacak komutu gir.'); cmdEl.focus(); return; }
    ensureMacroState();
    if (macroEditingId!=null){
      const m = macroState.macros.find(x=>x.id===macroEditingId);
      if (m){ m.name=name; m.cmd=cmd; m.cat=macroFormCategory||'custom'; }
      macroEditingId = null;
    } else {
      macroState.macros.push({ id: macroState.macroSeq++, name, cmd, cat: macroFormCategory || 'custom' });
    }
    saveMacros();
    document.getElementById('macroForm').classList.remove('show');
    document.getElementById('macroSaveBtn').textContent = 'Kaydet';
    renderMacroPanel();
  }

  function deleteMacro(id, name){
    if (!confirm(`"${name}" makrosunu silmek istiyor musun?`)) return;
    macroState.macros = macroState.macros.filter(x=>x.id!==id);
    saveMacros();
    renderMacroPanel();

  function renderMacroPanel(){
    const listEl = document.getElementById('macroListContainer');
    listEl.innerHTML = '';
    CATEGORIES.forEach(cat=>{
      const sec = document.createElement('div'); sec.className = 'catSection';
      const head = document.createElement('div'); head.className = 'catSectionHead';
      head.appendChild(makeIconCanvas(cat.icon, 20));
      const span = document.createElement('span'); span.textContent = cat.name.toUpperCase();
      head.appendChild(span);
      sec.appendChild(head);
      const chips = document.createElement('div'); chips.className = 'macroChips';
      const macros = macroState.macros.filter(m=>m.cat===cat.id);
      if (macros.length===0){
        const e = document.createElement('div'); e.className = 'emptyCat'; e.textContent = 'henüz makro yok';
        chips.appendChild(e);
      } else {

          const chip = document.createElement('div'); chip.className = 'macroChip';
          const nm = document.createElement('span'); nm.className = 'mName'; nm.textContent = m.name; nm.title = m.cmd;
          nm.addEventListener('click', ()=>{ input.value = m.cmd; closeMacroPanel(); });
          const runBtn = document.createElement('button'); runBtn.className = 'mRun'; runBtn.textContent = '▶'; runBtn.title = 'Hemen çalıştır';

          editBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openMacroFormForEdit(m); });

        });

      sec.appendChild(chips);
      listEl.appendChild(sec);
    });
  }

  // ---------- Fullscreen (desktop + Android via Fullscreen API, iOS fallback) ----------
  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  }
  function isInFullscreen(){
    return !!(document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement);
  }
  function updateFsBtnLabel(){
    const btn = document.getElementById('fsBtn');
    if (!btn) return;
    btn.textContent = isInFullscreen() ? '[⛶ ÇIK]' : '[⛶ TAM EKRAN]';
  }
  async function toggleFullscreen(){
    const el = document.documentElement;
    try{
      if (isInFullscreen()){
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
        else if (document.msExitFullscreen) await document.msExitFullscreen();
      } else if (isIOS()){
        // iOS Safari has no real Fullscreen API — best available is guiding the user to
        // "Add to Home Screen", which launches the page truly full-screen (no browser chrome).
        blank();
        print('📱 iOS\'ta tarayıcı tam ekranı desteklemiyor.','warn');
        print('Gerçek tam ekran için: Paylaş ▸ Ana Ekrana Ekle — sonra oyunu ana ekrandaki simgeden aç.','hi');
        return;
      } else {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) await el.msRequestFullscreen();
        else { print('Bu tarayıcı tam ekranı desteklemiyor.','warn'); return; }
      }
    }catch(e){ /* user gesture requirements etc. — silently ignore */ }
    updateFsBtnLabel();
    setTimeout(()=>input.focus(), 50);
  }
  const fsBtnEl = document.getElementById('fsBtn');
  if (fsBtnEl){
    updateFsBtnLabel();
    fsBtnEl.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFsBtnLabel);
    document.addEventListener('webkitfullscreenchange', updateFsBtnLabel);
    document.addEventListener('msfullscreenchange', updateFsBtnLabel);
  }

  // ---------- Input ----------
  const cmdLog = []; let histIdx=-1;
  input.addEventListener('keydown',(e)=>{
    if (e.key==='Enter'){
      const val=input.value; input.value='';
      cmdLog.push(val); histIdx=cmdLog.length;
      process(val);
    } else if (e.key==='ArrowUp'){
      if (histIdx>0){ histIdx--; input.value=cmdLog[histIdx]||''; } e.preventDefault();
    } else if (e.key==='ArrowDown'){
      if (histIdx<cmdLog.length-1){ histIdx++; input.value=cmdLog[histIdx]||''; } else { histIdx=cmdLog.length; input.value=''; } e.preventDefault();

  // Spear Phishing: belirli bir çalışana sosyal mühendislik e-postası gönder
  function cmdSpearphish(arg){
    if (!state){ print('Önce "newgame" ile oyun başlat.','warn'); return; }
    if (state.mode !== 'hacker'){ print('Bu komut sadece HACKER modunda.','warn'); return; }
    if (!arg){ 
      blank(); print('SPEAR PHİSHİNG','info');
      print('Hedefli sosyal mühendislik — bir çalışanın kimlik bilgilerini çal.','dim');
      print('Kullanım: spearphish <hostname>','warn');
      print('Mevcut bağlantı gerektirmez. Başarılı olursa hedef port otomatik kırılır.','dim');
      return; 
    }
    const host = findHost(arg.trim());
    if (!host){ print('Sunucu bulunamadı. "targets" ile listeyi gör.','warn'); return; }
    if (host.node.isGateway){ print('Gateway sunuculara phishing yapılamaz — önce içeri gir.','warn'); return; }
    const cost = 120 + host.node.security * 20;
    if (state.credits < cost){ print(`Phishing kampanyası için ${cost} kredi gerekiyor. Mevcut: ${state.credits}`,'bad'); return; }
    // Sosyal itibar ve araç bonusu
    const compSlug = host.company.slug;
    const socialBonus2 = (state.rep[state.faction]||0) > 200 ? 15 : 0;
    const factionBonus = state.faction === 'syndicate' ? 10 : (state.faction === 'ghost' ? 12 : 0);
    const successChance = Math.min(85, 35 + socialBonus2 + factionBonus - host.node.security * 2);
    state.credits -= cost;
    blank(); print(`SPEAR PHİSHİNG: ${arg.trim()}`,'warn');
    print(`  Maliyet: ${cost} kredi | Başarı şansı: %${successChance}`,'dim');
    print('  Hedef çalışan profillemeleniyor...','dim');
    setTimeout(()=>{
      if (Math.random()*100 < successChance){
        const prog = getProgress(arg.trim());
        const port = host.node.services[0];
        if (!prog.cracked.includes(port)){
          prog.cracked.push(port);
          print(`✓ BAŞARILI — ${serviceName[port] || port} portu kimlik bilgileri ele geçirildi.`,'hi');
          print(`  Çalışan tuzağa düştü: sahte VPN bağlantısı üzerinden session token çalındı.`,'info');
          traceGain(host.node.security * 3);
          unlockAchievement('spearphish_success');
        } else {
          print(`Port zaten kırık — ama kimlik bilgileri yedekte kaydedildi.`,'info');
        }
      } else {
        traceGain(host.node.security * 5);
        print(`✗ BAŞARISIZ — Çalışan e-postayı şüpheli buldu ve IT'yi bilgilendirdi.`,'bad');
        print(`  İz seviyesi arttı: +${Math.round(host.node.security*5)}`,'warn');
      }
      updateTopbar(); save();
    }, 800);
  }

    print('  Payload injecting...','dim');
    const criticalChance = 70 + (state.crackerLvl * 3);
    if (Math.random()*100 < criticalChance){
      if (!prog.cracked.includes(cve.port)) prog.cracked.push(cve.port);

    const parts = arg.trim().split(/\s+/);

      if (!prog.cracked.length){ print('Önce en az bir port kır.','warn'); return; }

      if (!state.backdoors) state.backdoors = {};
      const passive = lvl * 40 + info.node.security * 5;
      state.backdoors[session.connectedIp] = { lvl, passive_cr: passive, installedAtMin: state.gameMinutes, lastCollectMin: state.gameMinutes };

  function cmdExtort(arg){
    if (!state){ print('Önce "newgame" ile oyun başlat.','warn'); return; }
    if (state.mode !== 'hacker'){ print('Bu komut sadece HACKER modunda.','warn'); return; }
    if (!arg){
      blank(); print('ŞANTAJ SİSTEMİ','info');
      print('Ele geçirdiğin SIR dosyaları ile şirketleri şantaja zorla.','dim');
      print('Şirketler susması karşılığında büyük kredi öder.','dim');
      blank();
      const secretFiles = state.inventory.filter(i => i.value > 0 && (i.name.includes('secret') || i.name.includes('coverup') || i.name.includes('leaked') || i.name.includes('internal_memo') || i.name.includes('backdoor') || i.name.includes('manipulation') || i.name.includes('suppression') || i.name.includes('shadow')));
      if (secretFiles.length === 0){ print('  Envanterinde şantaj için uygun SIR dosyası yok.','dim'); print('  Mega-şirketlerin secret/leaked dosyalarını indir.','dim'); }
      else {
        print('  Kullanılabilir kozlar:','dim');
        secretFiles.forEach(f => print(`    ${f.name}  (${f.from})  ~${Math.round(f.value*4)} kredi değerinde`,'warn'));
      }
      print('Kullanım: extort <dosya_adı>','warn');
      return;
    }
    const fname = arg.trim();
    const fileIdx = state.inventory.findIndex(i => i.name === fname);
    if (fileIdx === -1){ print('Bu dosya envanterinde yok.','warn'); return; }
    const file = state.inventory[fileIdx];
    const isSecret = file.name.includes('secret') || file.name.includes('coverup') || file.name.includes('leaked') || file.name.includes('internal_memo') || file.name.includes('backdoor') || file.name.includes('manipulation') || file.name.includes('suppression') || file.name.includes('shadow');
    if (!isSecret){ print('Bu dosya şantaj için yeterince hassas değil. SIR dosyaları gerekiyor.','warn'); return; }
    const extortValue = Math.round(file.value * (3 + Math.random() * 3));
    const traceRisk = 15 + Math.floor(Math.random() * 20);
    const successChance = 60 + (state.faction === 'syndicate' ? 15 : 0) + (state.fenceLvl * 5);
    blank(); print(`ŞANTAJ GİRİŞİMİ: ${file.from}`, 'bad');
    print(`  Dosya: ${fname}`,'dim');
    print(`  Talep edilen ödeme: ${extortValue} kredi`,'warn');
    print(`  Başarı şansı: %${Math.min(90,successChance)}  |  İz riski: +${traceRisk}`,'dim');
    if (Math.random()*100 < Math.min(90,successChance)){
      state.inventory.splice(fileIdx, 1);
      state.credits += extortValue;
      addEarnings(extortValue);
      session.trace = Math.min(100, session.trace + traceRisk * 0.5);
      print(`✓ ŞANTAJ BAŞARILI — ${file.from} sessiz kalmayı tercih etti.`,'hi');
      print(`  +${extortValue} kredi yatırıldı. Dosya imha edildi.`,'gold');
      unlockAchievement('first_extort');
    } else {
      session.trace = Math.min(100, session.trace + traceRisk);
      print(`✗ ŞANTAJ REDDEDİLDİ — ${file.from} yetkililere ihbar etti!`,'bad');
      print(`  İz seviyesi kritik arttı: +${traceRisk}`,'bad');
      if (session.trace > 80) print(`  UYARI: İz seviyesi çok yüksek — bağlantını kes!`,'bad');
    }
    updateTopbar(); save();
  }

  function cmdFactionwar(arg){
    if (!state){ print('Önce "newgame" ile oyun başlat.','warn'); return; }
    if (!state.faction){ print('Önce bir fraksiyona katıl.','warn'); return; }
    if (!arg || arg.trim() === 'status'){

      print(`  Fraksiyonun: ${FACTIONS.find(f=>f.id===state.faction).name}`,'hi');
