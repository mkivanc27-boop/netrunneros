      });
      blank(); print('Kullanım: factionwar sabotage <fraksiyon_id>  |  factionwar raid','warn');
      return;
    }
    const parts = arg.trim().split(/\s+/);
    const sub = parts[0].toLowerCase();
    if (sub === 'sabotage'){
      const targetId = parts[1];
      const target = FACTIONS.find(f=>f.id===targetId);
      if (!target || targetId === state.faction){ print('Geçersiz fraksiyon hedefi.','warn'); return; }
      const myRep = state.rep[state.faction]||0;
      if (myRep < 150){ print(`Sabotaj için en az 150 itibar gerekiyor. Mevcut: ${myRep}.`,'warn'); return; }
      const cost = 300;
      if (state.credits < cost){ print(`Sabotaj için ${cost} kredi gerekiyor.`,'bad'); return; }
      state.credits -= cost;
      const isRival = target.id === FACTIONS.find(f=>f.id===state.faction).rival;
      const bonus = isRival ? 25 : 10;
      state.rep[state.faction] = (state.rep[state.faction]||0) + bonus;
      state.rep[targetId] = Math.max(0, (state.rep[targetId]||0) - 20);
      const reward = isRival ? 400 : 200;
      state.credits += reward; addEarnings(reward);
      blank(); print(`FRAKSİYON SABOTAJI: ${target.name}`,'bad');
      print(`  ${target.name}'ın altyapısına saldırı düzenlendi.`,'warn');
      print(`  Kendi itibarın: +${bonus}  |  Hedef itibarı: -20`,'hi');
      print(`  Ödül: +${reward} kredi.`,'gold');
      updateTopbar(); save();
    } else if (sub === 'raid'){
      const myRep = state.rep[state.faction]||0;
      if (myRep < 300){ print(`Raid için 300 itibar gerekiyor. Şu an: ${myRep}.`,'warn'); return; }
      const rivalId = FACTIONS.find(f=>f.id===state.faction).rival;
      const reward = 800 + Math.round(myRep * 0.5);

      state.rep[state.faction] = (state.rep[state.faction]||0) + 50;
      state.rep[rivalId] = Math.max(0, (state.rep[rivalId]||0) - 50);
      blank(); print('FRAKSİYON RAİDİ!','bad');
      print('Rakip fraksiyonun merkezi operasyonları sekteye uğratıldı.','warn');
      print(`  +${reward} kredi  |  +50 itibar  |  Rakip: -50 itibar`,'gold');
      unlockAchievement('faction_raid');
      updateTopbar(); save();
    } else { print('Kullanım: factionwar sabotage <id>  |  factionwar raid','warn'); }
  }

  // ---------- 1+2. Living Companies & Adaptive Security ----------
  const HACK_METHOD_LABELS = { crack:'brute-force crack', exploit:'CVE exploit', ransomware:'ransomware', ddos:'DDoS', social:'sosyal mühendislik', keylogger:'keylogger', spearphish:'spear phishing', zeroday:'zero-day', mitm:'MITM', backdoor:'backdoor' };
  function v3CompanyRecord(slug){
    const v3 = ensureV3(); if (!v3) return null;
    if (!v3.companies[slug]) v3.companies[slug] = { hostility:0, methods:{}, adaptedMethods:[], extraSecurity:0 };
    return v3.companies[slug];
  }
  // Deterministic "living" flavor stats derived from the slug — no extra save weight.
  function v3CompanyProfile(co){
    const rng = seededRand('v3corp-'+co.slug);
    const budget = Math.round((co.security*randInt(rng,8,22) + (co.isMega?400:0)) * 1e5);
    const employees = randInt(rng, co.security*80, co.security*80 + 4000) + (co.isMega?50000:0);
    const legalTeam = pick(rng, ['tek kişilik dış danışman','küçük iç hukuk birimi','orta ölçekli hukuk departmanı','agresif kurumsal hukuk ordusu']);
    const policeLink = pick(rng, ['yok / minimal','yerel siber suç birimiyle temas halinde','ulusal siber güvenlik ajansıyla sözleşmeli','özel bir kolluk görev gücüyle doğrudan hat']);
    const rivalCorp = pick(rng, MEGA_CORPS.filter(m=>m.name!==co.name).concat([{name:'bağımsız girişimler'}])).name;
    return { budget, employees, legalTeam, policeLink, rivalCorp };
  }
  function v3RecordMethod(company, method){
    if (!company) return;
    const rec = v3CompanyRecord(company.slug);
    if (!rec) return;
    rec.methods[method] = (rec.methods[method]||0)+1;

    const v3 = ensureV31();

    if (war && war.playerSide){
      const enemySlug = war.playerSide===war.a ? war.b : war.a;
      if (company.slug===enemySlug){
        if (war.playerSide===war.a) war.dmgA = (war.dmgA||0)+1; else war.dmgB = (war.dmgB||0)+1;

  function v3ResolveCorpWars(newDay){
    const v3 = ensureV31();
    v3.corpWars.forEach(w=>{
      if (w.resolved || newDay < w.endDay) return;
      w.resolved = true;
      const aInfo = COMPANY_INDEX[w.a], bInfo = COMPANY_INDEX[w.b];
      const aSec = aInfo?aInfo.company.security:5, bSec = bInfo?bInfo.company.security:5;
      let aScore = aSec + (w.dmgA||0)*1.5 + Math.random()*4;
      let bScore = bSec + (w.dmgB||0)*1.5 + Math.random()*4;
      const aWins = aScore >= bScore;
      const winnerSlug = aWins ? w.a : w.b, loserSlug = aWins ? w.b : w.a;
      const winnerName = aWins ? w.aName : w.bName, loserName = aWins ? w.bName : w.aName;
      const loserRec = v3CompanyRecord(loserSlug);
      loserRec.extraSecurity = Math.max(0, (loserRec.extraSecurity||0)-1); // yara almış, savunması zayıfladı
      let playerNote = '';
      if (w.playerSide){
        const sidedWithWinner = w.playerSide===winnerSlug;
        const dmgDealt = w.playerSide===w.a ? w.dmgA : w.dmgB;
        if (sidedWithWinner){
          const reward = 400 + dmgDealt*120;
          state.credits += reward; addEarnings(reward);

          const consolation = 100;
          state.credits += consolation;
          playerNote = `Kaybeden tarafı desteklemiştin — yine de +${consolation}¢ teselli ödülü aldın.`;
        }
      }
      v3Article('SAVAŞ SONA ERDİ: '+winnerName.toUpperCase()+' KAZANDI', [
        `${winnerName} ile ${loserName} arasındaki ${CORP_WAR_DURATION_DAYS} günlük kurumsal savaş sona erdi.`,
        `${winnerName} rakibinin pazar güvenini sarstı, hisseleri yükselirken ${loserName} ciddi değer kaybetti.`,
        `${loserName} içeriden gelen bilgilere göre güvenlik altyapısını acilen yeniden gözden geçiriyor — bu şirket şu an her zamankinden savunmasız.`,
        playerNote || 'Bu savaşa doğrudan taraf olmadın, sonuçları sadece piyasadan izledin.'
      ]);
      updateTopbar(); save();

  function cmdHackrival(arg){
    const v3 = ensureV33();

      if (!known.length){ print('Henüz bilinen bir rakip yok — önce sahada biriyle karşılaş.','dim'); return; }

        const ally = v3.allies.includes(n);
        const cd = v3.duelCooldowns[n];
        const onCooldown = cd!==undefined && (currentGameDay?currentGameDay():0) <= cd;
        const status = ally ? 'MÜTTEFİK (hedef alınamaz)' : onCooldown ? 'yeni pusuya düştü, bugün tekrar bulunamaz' : 'hedef alınabilir';
        print(`  ${n.padEnd(14)} Lv.${rp.lvl}  |  senin galibiyetin: ${rp.losses}  |  onun galibiyeti: ${rp.wins}  |  ${status}`, ally?'gold':onCooldown?'dim':'hi');
      });
      print('Kullanım: hackrival <isim>','dim');
      return;
    }
    const known = Object.keys(state.rivalProfiles||{}).find(n=>n.toLowerCase()===name.toLowerCase());
    if (!known){ print(`"${name}" adında bilinen bir rakip yok. Önce bir sunucuda onunla karşılaşmalısın.`,'warn'); return; }

    if (playerPower >= rivalPower){

      state.rivalsWon = (state.rivalsWon||0)+1;
      const loot = 150 + rp.lvl*90 + Math.round(Math.random()*100);
      state.credits += loot; addEarnings(loot);
      print(`✔ DÜELLO KAZANILDI — ${known}'in kişisel rig'ine sızdın, savunmasını çökerttin.`,'gold');
      print(`  Cüzdanından/proxy önbelleğinden ${loot}¢ çektin.`,'gold');
      v3AddFame(4 + rp.lvl);

      // İstihbarat / clue şansı

    } else {
      rp.wins++;
      const lost = Math.min(state.credits, 80 + rp.lvl*60);

      const traceHit = 8 + rp.lvl*2;
      print(`✗ DÜELLO KAYBEDİLDİ — ${known} seni geri izledi ve karşı saldırdı.`,'bad');

      print(`  Karşı saldırı sırasında konumun kısmen deşifre oldu (+iz).`,'bad');

  //  Anlık güç kıyaslaması yerine: rakibin uzmanlığına göre uzunlaşan/

  function v3RivalDifficulty(rp){
    // Uzmanlık = seviye + kişilik + bounty-hunter statüsü (node.security'nin rakip karşılığı)
    let d = rp.lvl*1.4;
    if (rp.personality==='soğukkanlı profesyonel') d += 2.2;
    if (rp.personality==='sinsi') d += 1.4;
    if (rp.personality==='kaotik') d -= 0.6; // dağınık ama öngörülemez, net olarak biraz daha kolay
    if (rp.isBountyHunter) d += 2.5;
    return Math.max(2, Math.min(15, d));
  }

  const _v34_origCmdHackrival = cmdHackrival;
  cmdHackrival = function(arg){
    const v3 = ensureV33();
    const name = (arg||'').trim();
    if (!name){ _v34_origCmdHackrival(arg); return; } // liste görünümü aynı kalıyor
    if (session.pendingRivalHack){ print('Zaten aktif bir rakip breach süreci var — önce onu bitir.','warn'); return; }

    const known = Object.keys(state.rivalProfiles||{}).find(n=>n.toLowerCase()===name.toLowerCase());
    if (!known){ print(`"${name}" adında bilinen bir rakip yok. Önce bir sunucuda onunla karşılaşmalısın.`,'warn'); return; }
    if (v3.allies.includes(known)){ print(`${known} artık müttefikin — ona saldıramazsın.`,'warn'); return; }
    const today = currentGameDay ? currentGameDay() : 0;
    if (v3.duelCooldowns[known]!==undefined && today <= v3.duelCooldowns[known]){
      print(`${known} son karşılaşmadan sonra saklandı — bugün onu bulamıyorsun. Yarın tekrar dene.`,'warn');
      return;
    }
    const rp = rivalProfileFor(known);
    v3.duelCooldowns[known] = today;

    const diff = v3RivalDifficulty(rp);
    const len = Math.min(18, 6 + Math.round(diff));
    let timeLimit = 22 - diff*1.1;
    timeLimit = Math.max(5, Math.round(timeLimit));
    const code = genCode(len);

    session.pendingRivalHack = { name: known, code, deadline: Date.now()+timeLimit*1000, diff };

    blank();
    print(`🎯 HEDEF KİLİTLENDİ: ${known}  (son bilinen IP: ${v3RivalIp(known)})`,'info');
    const opener = (DUEL_OPENERS[rp.personality]||(n=>`${n} saldırını fark etti.`))(known);

    print(`UZMANLIK SEVİYESİ: ${diff.toFixed(1)}/15  ${diff>=9?'(çok tecrübeli — ':diff>=5.5?'(tecrübeli — ':'(acemi — '}${len} karakterlik dizi, ${timeLimit} saniye)`,'warn');

  //  V3.5 — İZ (TRACE) DENGE YAMASI
  //  V3'ün adaptif güvenliği, zaten sert olan "iz %100 -> %20 kredi
  //  cezası" mekaniğiyle birleşince art arda yakalanma sarmalına
  //  sebep olabiliyordu. Bu yama:
  //   1) Art arda kısa sürede yakalanırsan ceza yüzdesini düşürür,
  //   2) Yakalandıktan sonra birkaç dakikalık bir "soğuma" verir,
  //   3) İz %80'i geçince erken uyarı basar.
  //  (Adaptif güvenliğin maksimum bonusu da 5'ten 3'e düşürüldü.)
  // ════════════════════════════════════════════════════════════════

  const _v35_origForceTrace = forceTrace;
  forceTrace = async function(){
    if (state.hardcore){ await _v35_origForceTrace(); return; }
    const v3 = ensureV3();
    const now = state.gameMinutes||0;
    if (v3.lastForceTraceMin===undefined) v3.lastForceTraceMin = -99999;
    const withinStreak = (now - v3.lastForceTraceMin) < 60; // aynı 1 saatlik pencere içinde art arda mı
    v3.forceTraceStreak = withinStreak ? (v3.forceTraceStreak||0)+1 : 1;
    v3.lastForceTraceMin = now;

    const info = findHost(session.connectedIp);
    if (info) getProgress(session.connectedIp).alerted = true;
    blank();
    print('!!! IDS ALARM TETİKLENDİ !!!','bad');
    const pct = Math.max(0.05, 0.20 - (v3.forceTraceStreak-1)*0.05); // %20 -> %15 -> %10 -> taban %5
    const penalty = Math.min(Math.floor(state.credits*pct), 150000); // tavan: tek yakalanmada en fazla 150k
    state.credits -= penalty;
    print(`İz sürme %100'e ulaştı. Bağlantı zorla kesildi. -${penalty} kredi ceza (%${Math.round(pct*100)}).`,'bad');
    if (v3.forceTraceStreak>1) print(`  (Art arda yakalanma cezası otomatik düşürüldü: tam %20 yerine %${Math.round(pct*100)} uygulandı.)`,'dim');
    print('Bu ağ bir süreliğine seni işaretledi.','warn');
    session.connectedIp = null; session.trace = 0; session.pendingCrack=null; session.pendingFirewall=null;
    session.v3TraceGraceUntilMin = now + 10; // 10 oyun-içi dakika iz artışı yarı hızda
    session.v3Trace80Warned = false;
    print('  Sistemler seni geçici olarak gözden kaybetti — önümüzdeki birkaç dakika iz artışın daha yavaş olacak.','dim');
    updatePrompt(); updateTopbar(); save();
  };

  const _v35_origTraceMultiplier = traceMultiplier;
  traceMultiplier = function(){
    let m = _v35_origTraceMultiplier();
    if (session.v3TraceGraceUntilMin && (state.gameMinutes||0) < session.v3TraceGraceUntilMin) m *= 0.5;
    return m;
  };

  // Erken uyarı: iz %80'i ilk geçtiğinde bir kez uyar.
  const _v35_origTraceGain = traceGain;
  traceGain = function(amount){
    const before = session.trace;
    _v35_origTraceGain(amount);
    if (before<80 && session.trace>=80 && session.trace<100 && !session.v3Trace80Warned){
      session.v3Trace80Warned = true;
      print('⚠ İZ %80\'İ GEÇTİ — bir hata daha seni yakalatabilir. "disconnect" ile çekilmeyi ya da "wipelogs" kullanmayı düşün.','warn');
    }
    if (session.trace<80) session.v3Trace80Warned = false;
  };

  boot();
})();
</script>
